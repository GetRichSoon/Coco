<html><head><meta charset="utf-8">

<style>

.lock { color: var(--dim); font-size: 11px; } .ti.small { width: 24px; height: 24px; }
.wifiitem { display: flex; align-items: center; gap: 2px; } .wifiitem .netrow { flex: 1; }

.join .btn { height: 34px; min-width: 0; } .msg { margin: 0 0 4px; color: var(--orange); font-size: 12px; } .btn.wide { width: 100%; height: 34px; margin-top: 6px; font-size: 13px; }
.tilebtn b { display: block; font-weight: 600; } .tilebtn small { display: block; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 130px; }
.ti { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: #48484a; flex: none; }
.tilebtn.on .ti { background: var(--blue); } .ti.green { background: var(--green); color: #000; }
.sl { position: relative; display: flex; align-items: center; height: 34px; margin-top: 8px; border-radius: 17px; background: var(--chip); overflow: hidden; }
.sl::before { content: ""; position: absolute; inset: 0 auto 0 0; width: var(--v); background: #fff; pointer-events: none; }
.sl .si { position: relative; z-index: 1; width: 34px; display: grid; place-items: center; color: #636366; pointer-events: none; }
.sl .sv { position: absolute; right: 12px; z-index: 1; color: var(--dim); font-weight: 600; pointer-events: none; }
.sl input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.np { display: flex; gap: 12px; align-items: center; }
.art { width: 64px; height: 64px; border-radius: 14px; object-fit: cover; flex: none; } .art.blank { display: grid; place-items: center; background: var(--chip); }
.np .g { min-width: 0; flex: 1; } .np b { display: block; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .np small { color: var(--dim); display: block; }
.bars.big { height: 18px; margin-top: 8px; } .bars.big i { width: 4px; }
.bars.on i:nth-child(4) { animation-delay: -.45s; } .bars.on i:nth-child(5) { animation-delay: -.15s; }

.batt::after { content: ""; position: absolute; right: -4px; top: 3px; width: 2px; height: 4px; border-radius: 0 2px 2px 0; background: rgba(255,255,255,.55); }
.batt i { display: block; height: 100%; border-radius: 2px; background: #fff; }

.cal span.in { color: #fff; } .cal span.today { background: var(--orange); color: #000; font-weight: 700; }
.split { display: flex; gap: 14px; } .split > div { flex: 1; }
.trow { padding: 5px 8px; border-radius: 10px; line-height: 1.38; font-size: 12px; } .trow:hover { background: #ffffff14; }
.tw { font-weight: 700; color: var(--accent); } .tto { color: var(--dim); font-weight: 400; } .tt { color: var(--fg); }
.hqrow { display: flex; gap: 6px; flex-wrap: wrap; margin: 2px 0 4px; } .chip2 { display: inline-flex; align-items: center; gap: 5px; background: #ffffff14; border-radius: 50px; padding: 3px 9px; font-size: 11px; } .chip2 .d { width: 7px; height: 7px; border-radius: 50%; }
</style></head>
<body>
<div id="pill" tabindex="0" role="button" aria-label="Coco Island. Press Enter to open." aria-expanded="false">
  <div class="face" id="compact"><div class="l" id="cl"></div><div class="r" id="cr"></div></div>
  <div class="face" id="toastFace"><span class="dot orange"></span><div class="g"><b id="tT"></b><small class="muted" id="tS"></small></div></div>
  <div class="face" id="full">
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="panel" id="p-coco" role="tabpanel"></div>
    <div class="panel" id="p-music" role="tabpanel"></div>
    <div class="panel" id="p-control" role="tabpanel"></div>
    <div class="panel" id="p-focus" role="tabpanel"></div>
  </div>
</div>
<script>

}
let S = { approvals: [], tasks: {}, sessions: [], doneToday: 0, recentDone: [] }, media = null, battery = null, weather = '', modules = { coco: true, music: true, control: true, focus: true };
const ICON = {
  note: '<svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><path d="M12 3v10.6A4 4 0 1 0 14 17V7h4V3z"/></svg>',

  wifi: '<svg width="18" height="18" viewBox="0 0 24 20" fill="currentColor"><path d="M12 19l3.4-4.2a5.6 5.6 0 0 0-6.8 0zM5.5 11.2a10 10 0 0 1 13 0l-2.1 2.6a6.7 6.7 0 0 0-8.8 0zM1 5.6a17 17 0 0 1 22 0l-2.1 2.6a13.7 13.7 0 0 0-17.8 0z"/></svg>',

  moon: '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M20 15.3A8.5 8.5 0 1 1 8.7 4a7 7 0 0 0 11.3 11.3z"/></svg>',

let vol = { level: null, mute: false }, radio = {};

const slider = (id, icon, v, label, missing) => missing ? '' : `<label class="sl" style="--v:${v}%"><span class="si">${icon}</span><input type="range" min="0" max="100" value="${v}" id="${id}" aria-label="${label}"><span class="sv">${v}</span></label>`;
let tab = 'coco', open = false, pomo = null, toastTimer = null, net = null, bright = null, charging = false, chargeSecs = Infinity;
const wifiIcon = () => {
  if (!net || !net.on) return '<svg width="16" height="14" viewBox="0 0 24 20" aria-label="No Wi-Fi"><path d="M2 2l20 16" stroke="#ff453a" stroke-width="2.4"/><path d="M12 18l3-4a5 5 0 0 0-6 0z" fill="rgba(255,255,255,.4)"/></svg>';

const TABS = [['coco', 'Coco'], ['music', 'Music'], ['control', 'Control'], ['focus', 'Focus']];

// ---- size: Bloom's springs (width 400/31, height 450/29, corners 1000/40), run only while moving ----
const SIZES = { compact: [200, 32, 16], open: [462, 300, 30], toast: [360, 62, 30] };
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const SPR = [[600, 42], [650, 44], [1200, 55]];   // stiffer than Bloom: quicker, smooth, barely any bounce
let cur = [...SIZES.compact], vel = [0, 0, 0], goal = [...SIZES.compact], raf = 0, lastT = 0;
function mode(m) {
  goal = [...SIZES[m]];
  pill.classList.toggle('open', m === 'open'); pill.classList.toggle('toast', m === 'toast');
  I.rect({ w: goal[0], h: goal[1] });   // main uses it to keep clicks on the pill and to know when the pointer left
  if (reduced) { cur = [...goal]; paint(); return; }
  if (!raf) { lastT = performance.now(); raf = requestAnimationFrame(step); }
}
function paint() { pill.style.width = cur[0] + 'px'; pill.style.height = cur[1] + 'px'; pill.style.borderRadius = `0 0 ${cur[2]}px ${cur[2]}px`; }
function step(t) {
  const dt = Math.min(0.032, (t - lastT) / 1000); lastT = t; let moving = false;
  for (let i = 0; i < 3; i++) {
    const [k, c] = SPR[i];
    vel[i] += (k * (goal[i] - cur[i]) - c * vel[i]) * dt; cur[i] += vel[i] * dt;
    if (Math.abs(goal[i] - cur[i]) > 0.3 || Math.abs(vel[i]) > 0.3) moving = true; else { cur[i] = goal[i]; vel[i] = 0; }
  }
  paint();
  raf = moving ? requestAnimationFrame(step) : 0;   // idle = no frames at all
}
paint();

// ---- hover: Coco Lounge watches the pointer (top-centre band, Bloom's 200 ms dwell) and tells the island ----
I.onHover((v) => setOpen(v));
pill.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target === pill) setOpen(!open); if (e.key === 'Escape') { setOpen(false); I.blur(); } });

function setOpen(v) {
  if (v === open) return; open = v;
  pill.setAttribute('aria-expanded', v);
  if (v) renderFull();
  mode(v ? 'open' : 'compact');
}

// ---- compact: the most important thing first (approval > music > working agents > clock) ----
// Only touch the DOM when the text changed, so the bars and dots keep animating smoothly.
const set = (el, h) => { if (el._h !== h) { el.innerHTML = h; el._h = h; } };
function renderCompact() {
  const l = $('#cl'), r = $('#cr');
  const working = S.sessions.length + (S.tasks.working || 0);
  if (modules.coco && S.approvals.length) { set(l, `<span class="dot orange pulse"></span><span>${S.approvals.length} approval${S.approvals.length > 1 ? 's' : ''}</span>`); set(r, `<span class="muted">YES?</span>`); }
  else if (modules.music && media && media.playing) { set(l, `${media.art ? `<img src="${media.art}" alt="" style="width:20px;height:20px;border-radius:6px;object-fit:cover">` : `<span aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3v10.6A4 4 0 1 0 14 17V7h4V3z"/></svg></span>`}<span style="max-width:110px;overflow:hidden;text-overflow:ellipsis">${esc(media.title)}</span>`); set(r, '<span class="bars on"><i></i><i></i><i></i></span>'); }
  else if (pomo) { const left = Math.max(0, pomo.end - Date.now()); set(l, `<span class="dot ${pomo.brk ? '' : 'orange'}"></span><span>${pomo.brk ? 'Break' : 'Focus'}</span>`); set(r, `<span style="color:var(--orange)">${fmt(left)}</span>`); }
  else if (modules.coco && working) { set(l, `<span class="dot pulse"></span><span>${working} working</span>`); set(r, `<span class="muted">${S.doneToday} done</span>`); }
  else { set(l, `<span>${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span><span class="muted">${esc(weather)}</span>`); set(r, statusIcons()); }
  pill.setAttribute('aria-label', 'Coco Island: ' + $('#compact').innerText.replace(/\s+/g, ' ') + '. Press Enter to open.');
}
const fmt = (ms) => { const s = Math.round(ms / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };

// ---- expanded ----
function renderFull() {
  const shown = TABS.filter(([k]) => modules[k]); if (!shown.some(([k]) => k === tab)) tab = (shown[0] || ['coco'])[0];
  $('#tabs').innerHTML = shown.map(([k, n]) => `<button role="tab" aria-selected="${k === tab}" data-tab="${k}">${n}</button>`).join('');
  document.querySelectorAll('.panel').forEach((p) => p.classList.toggle('on', p.id === 'p-' + tab));
  if (tab === 'coco') {
    const hq = S.hq || { working: 0, queued: 0 }, talk = S.talk || [];
    $('#p-coco').innerHTML = `<div class="stats"><div class="stat"><b>${hq.working}</b><small>working</small></div><div class="stat"><b>${hq.queued}</b><small>queued</small></div><div class="stat"><b>${S.approvals.length}</b><small>need YES</small></div><div class="stat"><b>${S.doneToday}</b><small>done</small></div></div>`
      + (S.approvals.length ? '<h3>Waiting for your YES</h3>' + S.approvals.slice(0, 3).map((a) => `<div class="row" tabindex="0" data-open="approvals"><span class="dot orange"></span><div class="g"><b>${esc(a.code)} · ${esc(a.team)}</b><small>${esc(a.what)}</small></div></div>`).join('') : '')
      + '<h3>Team talk</h3>'
      + (talk.length ? talk.map((t) => `<div class="trow"><span class="tw">${esc(t.from)}${t.to ? ' <span class="tto">\u2192 ' + esc(t.to) + '</span>' : ''}</span> <span class="tt">${esc(t.text)}</span></div>`).join('') : '<p class="muted">Quiet right now. The team talks to each other here as they work.</p>')
      + (S.sessions.length ? '<h3>Claude at work</h3>' + S.sessions.slice(0, 2).map((s) => `<div class="row" tabindex="0" data-open="board"><span class="dot pulse"></span><div class="g"><b>${esc(s.now)}</b><small>${esc(s.ago)}</small></div></div>`).join('') : '');
  }
  if (tab === 'music') $('#p-music').innerHTML = media && !media.none
    ? `<div class="np">${media.art ? `<img class="art" src="${media.art}" alt="">` : `<span class="art blank">${ICON.note}</span>`}<div class="g"><b>${esc(media.title)}</b><small>${esc(media.artist || appName(media.app))}</small>
        <span class="bars big ${media.playing ? 'on' : ''}"><i></i><i></i><i></i><i></i><i></i></span></div></div>
      <div class="btns"><button class="btn" data-media="prev" aria-label="Previous">${ICON.prev}</button><button class="btn big" data-media="playpause" aria-label="${media.playing ? 'Pause' : 'Play'}">${media.playing ? ICON.pause : ICON.play}</button><button class="btn" data-media="next" aria-label="Next">${ICON.next}</button></div>`
    : `<div class="np"><span class="art blank">${ICON.note}</span><div class="g"><b>Nothing playing</b><small>Start a song in any app</small></div></div><div class="btns"><button class="btn big" data-media="playpause" aria-label="Play">${ICON.play}</button></div>`;
  // Command Center, Bloom style: four tiles (two real switches) and two sliders with the real levels.
  if (tab === 'control' && sub) { $('#p-control').innerHTML = subPanel(); const pw = $('#wpw'); if (pw && document.activeElement !== pw) pw.focus(); }
  else if (tab === 'control') $('#p-control').innerHTML = `<div class="tiles">
      ${tile('wifi', ICON.wifi, 'Wi-Fi', radio.wifi, net && net.on ? esc(net.ssid) : radio.wifi === false ? 'Off' : 'Not connected')}
      ${tile('bt', ICON.bt, 'Bluetooth', radio.bt, radio.bt ? 'On' : radio.bt === false ? 'Off' : '')}
      <button class="tilebtn" data-set="ms-settings:quiethours"><span class="ti">${ICON.moon}</span><span><b>Focus</b><small>Do not disturb</small></span></button>
      <button class="tilebtn" data-set="ms-settings:batterysaver"><span class="ti ${charging ? 'green' : ''}">${ICON.bolt}</span><span><b>${battery != null ? battery + '%' : 'Battery'}</b><small>${charging ? (isFinite(chargeSecs) && chargeSecs > 0 ? Math.round(chargeSecs / 60) + ' min to full' : 'Charging') : (isFinite(chargeSecs) && chargeSecs > 0 ? Math.round(chargeSecs / 60) + ' min left' : 'On battery')}</small></span></button>
    </div>
    ${slider('vol', vol.mute ? ICON.muted : ICON.speaker, vol.level, 'Volume', vol.level == null)}
    ${slider('bright', ICON.sun, bright, 'Brightness', bright == null)}`;
  if (tab === 'focus') $('#p-focus').innerHTML = `<div class="split"><div>${monthGrid()}</div><div>` + (pomo
    ? `<div class="big-time" style="color:${pomo.brk ? 'var(--green)' : 'var(--orange)'}">${fmt(Math.max(0, pomo.end - Date.now()))}</div><p class="muted" style="text-align:center">${pomo.brk ? 'Break' : 'Focus'} · round ${pomo.round}</p><div class="btns"><button class="btn" data-pomo="stop">Stop</button></div>`
    : `<div class="big-time">25:00</div><p class="muted" style="text-align:center">25 min focus, 5 min break</p><div class="btns"><button class="btn big" data-pomo="start">Start</button></div>`) + '</div></div>';
}

pill.addEventListener('click', (e) => {
  const t = e.target.closest('[data-tab],[data-open],[data-media],[data-vol],[data-set],[data-pomo],[data-radio],[data-sub],[data-net],[data-join],[data-pass],[data-copy],[data-portal]'); if (!t) return;
  const d = t.dataset;
  if (d.tab) { tab = d.tab; renderFull(); }
  if (d.open) { I.openCoco(d.open); I.close(); }
  if (d.media) I.act('media', { key: d.media });
  if (d.vol) I.act('volume', { key: d.vol, steps: 2 });
  if (d.radio && !t.disabled) { radio[d.radio] = !radio[d.radio]; renderFull(); I.act('radio', { kind: d.radio, on: radio[d.radio] }); }
  if (d.sub !== undefined) { sub = d.sub || null; joinSsid = null; wifiMsg = ''; passShown = null; if (sub === 'wifi') { wifiList = null; I.act('wifiscan'); } if (sub === 'bt') { btList = null; I.act('btlist'); } renderFull(); }
  if (d.pass) { passShown = { ssid: d.pass, loading: true }; I.act('wifipass', { ssid: d.pass }); renderFull(); }
  if (d.copy) { navigator.clipboard && navigator.clipboard.writeText(d.copy); t.textContent = 'Copied'; }
  if (d.portal) I.act('portal');
  if (d.net) { if (d.saved === '1') { wifiMsg = 'Connecting to ' + d.net + '…'; I.act('wificonnect', { ssid: d.net }); } else joinSsid = joinSsid === d.net ? null : d.net; renderFull(); }
  if (d.join) { const pw = $('#wpw'); if (pw && pw.value) { wifiMsg = 'Connecting to ' + d.join + '…'; I.act('wificonnect', { ssid: d.join, password: pw.value }); pw.value = ''; joinSsid = null; renderFull(); } }
  if (d.set) I.openSettings(d.set);
  if (d.pomo === 'start') startPomo(false, 1);
  if (d.pomo === 'stop') { pomo = null; renderFull(); renderCompact(); }
});
pill.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target !== pill) e.target.click(); });
// Sliders: fill follows the finger at once; the PC is told at most every 80 ms and once more on release.
let slideAt = 0;
pill.addEventListener('input', (e) => {
  const t = e.target; if (t.id !== 'vol' && t.id !== 'bright') return;
  const v = Number(t.value); t.parentElement.style.setProperty('--v', v + '%'); t.parentElement.querySelector('.sv').textContent = v;
  if (t.id === 'vol') vol.level = v; else bright = v;
  if (Date.now() - slideAt > 80) { slideAt = Date.now(); I.act(t.id === 'vol' ? 'vol' : 'bright', { level: v }); }
});
pill.addEventListener('change', (e) => { const t = e.target; if (t.id === 'vol' || t.id === 'bright') I.act(t.id === 'vol' ? 'vol' : 'bright', { level: Number(t.value) }); });
let wheelAt = 0;
pill.addEventListener('wheel', (e) => {
  if (!open || e.target.closest('.panel') && e.target.closest('.panel').scrollHeight > e.target.closest('.panel').clientHeight) return;
  if (Date.now() - wheelAt < 300) return; wheelAt = Date.now();
  const shown = TABS.filter(([k]) => modules[k]).map(([k]) => k), i = shown.indexOf(tab);
  tab = shown[(i + (e.deltaY > 0 || e.deltaX > 0 ? 1 : -1) + shown.length) % shown.length]; renderFull();
}, { passive: true });

function startPomo(brk, round) { pomo = { brk, round, end: Date.now() + (brk ? 5 : 25) * 60000 }; renderFull(); renderCompact(); }

// ---- toasts: a new approval or a finished job, like a phone notification ----
function toast(title, sub, color) {
  if (modules.quiet) return;   // office mode: no pop-ups on the PC (Boss, 2026-10-23)
  $('#tT').textContent = title; $('#tS').textContent = sub;
  $('#toastFace .dot').className = 'dot ' + (color === 'green' ? '' : 'orange');
  if (!open) mode('toast');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { if (!open) mode('compact'); }, 4500);
}

// ---- data in ----
let seenApprovals = null, seenDone = null;
I.onData((d) => {
  const ids = new Set(d.approvals.map((a) => a.id));
  if (seenApprovals) for (const a of d.approvals) if (!seenApprovals.has(a.id)) toast('Approval needed', a.code + ' · ' + a.what);
  if (seenDone != null && d.doneToday > seenDone && d.recentDone[0]) toast('Job done', d.recentDone[0]);
  seenApprovals = ids; seenDone = d.doneToday; S = d; renderCompact(); if (open) renderFull();
});
I.onMedia((m) => { media = m.none ? null : m; renderCompact(); if (open && tab === 'music') renderFull(); });
I.onModules((m) => { modules = m; renderCompact(); if (open) renderFull(); });

// Battery and weather: battery from Chromium; weather once an hour from Open-Meteo (no key), place from the IP once.
navigator.getBattery?.().then((b) => {
  const up = (plug) => {
    const was = charging; battery = Math.round(b.level * 100); charging = b.charging; chargeSecs = charging ? b.chargingTime : b.dischargingTime;
    if (plug && was !== charging) toast(charging ? 'Charging' : 'On battery', battery + '%' + (charging ? ' ⚡' : ''), charging ? 'green' : '');
    renderCompact(); if (open && tab === 'control') renderFull();
  };
  up(false);
  b.addEventListener('levelchange', () => up(false)); b.addEventListener('chargingchange', () => up(true));
  b.addEventListener('chargingtimechange', () => up(false)); b.addEventListener('dischargingtimechange', () => up(false));
});
I.onSys((m) => {
  if (m.t === 'max') pill.classList.toggle('away', !!m.on);
  if (m.t === 'net') net = m; if (m.t === 'bright') bright = m.level; if (m.t === 'vol') vol = m; if (m.t === 'radio') radio = { wifi: m.wifi, bt: m.bt };
  if (m.t === 'wifilist') { wifiList = m.list; if (m.why) wifiMsg = m.why; }
  if (m.t === 'btlist') btList = m.list;
  if (m.t === 'accent' && m.hex) applyAccent(m.hex);
  if (m.t === 'wifipass') { passShown = { ssid: m.ssid, password: m.password, why: m.why }; }
  if (m.t === 'wifiresult') { wifiMsg = m.ok ? 'Connected to ' + m.ssid : 'Could not connect to ' + m.ssid + (m.why ? ': ' + m.why : ''); if (m.ok) I.act('wifiscan'); }
  renderCompact();
  if (open && tab === 'control' && !['vol', 'bright', 'wpw'].includes(document.activeElement?.id) && Date.now() - slideAt > 600) renderFull();
});
async function loadWeather() {
  try {
    const loc = await (await fetch('https://ipapi.co/json/')).json();
    const w = await (await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${loc.latitude}&longitude=${loc.longitude}&current=temperature_2m`)).json();
    weather = Math.round(w.current.temperature_2m) + '°';
  } catch { weather = ''; }
  renderCompact();
}
loadWeather(); setInterval(loadWeather, 3600000);

// One clock tick a second only while something on screen counts (focus timer) or the clock shows; idle otherwise.
setInterval(() => {
  if (pomo && Date.now() >= pomo.end) { const brk = !pomo.brk; I.act('notify', { text: brk ? 'Focus done. Take 5.' : 'Break over. Back to focus.' }); startPomo(brk, pomo.round + (brk ? 0 : 1)); }
  if (!document.hidden) { renderCompact(); if (open && tab === 'focus') renderFull(); }
}, 1000);
renderCompact();
</script>
</body></html>
