:root {

  --glow: linear-gradient(transparent, transparent); --shadow: 0 10px 28px -8px rgba(0,0,0,.75), 0 0 0 1px rgba(255,255,255,.08);
  /* old names kept so every existing inline style still resolves */

  box-shadow: var(--shadow); overflow: hidden; cursor: default; outline: none; will-change: width, height; }
#pill:focus-visible { box-shadow: var(--shadow), 0 0 0 2px var(--acc); }

/* Theme 2, "Mafia": ALL BLACK. Pure black surface, white / silver hairlines, greyscale characters, crimson only for trouble, serif small caps, sharp corners, fine pinstripe. Only this theme gets this UI. */
:root[data-theme=mafia] {

let slideAt = 0;
pill.addEventListener('input', (e) => {
  const t = e.target; if (t.id !== 'vol' && t.id !== 'bright') return;
  const v = Number(t.value); t.parentElement.style.setProperty('--v', v + '%'); t.parentElement.querySelector('.sv').textContent = v;
  if (t.id === 'vol') vol.level = v; else bright = v;
  if (Date.now() - slideAt > 80) { slideAt = Date.now(); I.act(t.id === 'vol' ? 'vol' : 'bright', { level: v }); }
});
pill.addEventListener('change', (e) => { const t = e.target; if (t.id === 'vol' || t.id === 'bright') I.act(t.id === 'vol' ? 'vol' : 'bright', { level: Number(t.value) }); });
let wheelAt = 0;
pill.addEventListener('wheel', (e) => {
  if (!open || e.target.closest('.panel') && e.target.closest('.panel').scrollHeight > e.target.closest('.panel').clientHeight) return;
  if (Date.now() - wheelAt < 300) return; wheelAt = Date.now();
  stepTab(e.deltaY > 0 || e.deltaX > 0 ? 1 : -1);
}, { passive: true });

function startPomo(brk, round) { pomo = { brk, round, end: Date.now() + (brk ? 5 : 25) * 60000 }; renderFull(); renderCompact(); }

// ---- toasts: stacked cards (newest on top, max 3), each key shown once per 10 min so nothing doubles ----
let toasts = [];
const toastSeen = new Map();
const TICON = { orange: ['var(--acc)', ICON.ask], green: ['var(--ok)', ICON.check], red: ['var(--bad)', ICON.alert] };
function toast(title, sub, color, key) {
  if (modules.quiet) return;   // office mode: no pop-ups on the PC (Boss, 2026-10-23)
  const now = Date.now(); key = key || title + '|' + sub;
  for (const [k, at] of toastSeen) if (now - at > 600000) toastSeen.delete(k);
  if (toastSeen.has(key)) return; toastSeen.set(key, now);
  toasts = [{ title, sub, color: TICON[color] ? color : 'orange', key }, ...toasts].slice(0, 3);
  $('#toastFace').innerHTML = toasts.map((t) => { const [c, ic] = TICON[t.color]; return `<div class="toastrow"><span class="ticon" style="--c:${c}">${ic}</span><div class="g"><b>${tx(t.title)}</b><small>${tx(t.sub)}</small></div></div>`; }).join('');
  SIZES.toast[1] = 14 + toasts.length * 44;
  if (!open) mode('toast');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { toasts = []; if (!open) mode('compact'); }, 4500 + 1500 * (toasts.length - 1));
}

// ---- data in ----
let seenApprovals = null, seenDone = null, seenTalk = null, seenIssues = null;
I.onData((d) => {
  const ids = new Set(d.approvals.map((a) => a.id)), iss = new Set((d.issues || []).map((t) => t.id + t.status));
  if (seenApprovals) for (const a of d.approvals) if (!seenApprovals.has(a.id)) toast('Approval needed', a.code + ' · ' + a.what, 'orange', 'ap' + a.id);
  if (seenDone != null && d.doneToday > seenDone && d.recentDone[0]) toast('Job done', d.recentDone[0], 'green', 'done' + d.recentDone[0]);
  if (seenIssues) for (const t of d.issues || []) if (!seenIssues.has(t.id + t.status)) toast('Task ' + t.status, (t.who ? who(t.who) + ': ' : '') + t.title, 'red', 'iss' + t.id + t.status);
  S = d; renderCompact(); if (open) renderFull();
  seenApprovals = ids; seenDone = d.doneToday; seenIssues = iss; seenTalk = new Set((d.talk || []).map((t) => t.k));   // after the render: rows not in the last set animate in
});
I.onMedia((m) => { media = m.none ? null : m; renderCompact(); if (open && tab === 'music') renderFull(); });
I.onModules((m) => { modules = m; renderCompact(); if (open) renderFull(); });
I.onPrefs((p) => { prefs = p; applyTheme(); if (open && gear) renderFull(); });
// CPU / RAM: asked for only while the Coco panel is open on screen (no work while closed).
function pollSys() { if (!open || document.hidden || tab !== 'coco' || gear || modules.coco !== true) return; I.act('sysinfo').then((v) => { if (v && typeof v === 'object') { sys = v; const el = $('#sysl'); if (el) el.innerHTML = sysLine(); } }).catch(() => {}); }
setInterval(pollSys, 3000);

// Battery and weather: battery from Chromium; weather once an hour from Open-Meteo (no key), place from the IP once.
navigator.getBattery?.().then((b) => {
  const up = (plug) => {
    const was = charging; battery = Math.round(b.level * 100); charging = b.charging; chargeSecs = charging ? b.chargingTime : b.dischargingTime;
    if (plug && was !== charging) toast(charging ? 'Charging' : 'On battery', battery + '%', charging ? 'green' : 'orange', 'batt' + charging + Math.floor(Date.now() / 60000));
    renderCompact(); if (open && tab === 'control') renderFull();
  };
  up(false);
  b.addEventListener('levelchange', () => up(false)); b.addEventListener('chargingchange', () => up(true));
  b.addEventListener('chargingtimechange', () => up(false)); b.addEventListener('dischargingtimechange', () => up(false));
});
I.onSys((m) => {
  if (m.t === 'max') pill.classList.toggle('away', !!m.on);
  if (m.t === 'net') net = m; if (m.t === 'bright') bright = m.level; if (m.t === 'vol') vol = m; if (m.t === 'radio') radio = { wifi: m.wifi, bt: m.bt };
  if (m.t === 'wifilist') { wifiList = m.list; if (m.why) wifiMsg = m.why; }
  if (m.t === 'btlist') btList = m.list;
  if (m.t === 'wifipass') { passShown = { ssid: m.ssid, password: m.password, why: m.why }; }
  if (m.t === 'wifiresult') { wifiMsg = m.ok ? 'Connected to ' + m.ssid : 'Could not connect to ' + m.ssid + (m.why ? ': ' + m.why : ''); if (m.ok) I.act('wifiscan'); }
  renderCompact();
  if (open && tab === 'control' && !['vol', 'bright', 'wpw'].includes(document.activeElement?.id) && Date.now() - slideAt > 600) renderFull();
});
async function loadWeather() {
  try {
    const loc = await (await fetch('https://ipapi.co/json/')).json();
    const w = await (await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${loc.latitude}&longitude=${loc.longitude}&current=temperature_2m`)).json();
    weather = Math.round(w.current.temperature_2m) + '°';
  } catch { weather = ''; }
  renderCompact();
}
loadWeather(); setInterval(loadWeather, 3600000);

// One clock tick a second only while something on screen counts (focus timer) or the clock shows; idle otherwise.
setInterval(() => {
  if (pomo && Date.now() >= pomo.end) { const brk = !pomo.brk; I.act('notify', { text: brk ? 'Focus done. Take 5.' : 'Break over. Back to focus.' }); startPomo(brk, pomo.round + (brk ? 0 : 1)); }
  if (!document.hidden) { renderCompact(); if (open && tab === 'focus') renderFull(); }
}, 1000);
renderCompact();
window.__ready = true;
</script>
</body></html>
