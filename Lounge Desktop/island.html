<!doctype html>
<html><head><meta charset="utf-8">
<title>Coco Island</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src https://api.open-meteo.com https://ipapi.co; img-src 'self' data:">
<style>
/* Coco Island (Bloom-style): a black pill at the top centre of the screen. The window is transparent and lets clicks
   through everywhere except the pill. Width, height and corners spring together (one curve), content fades in after. */
:root { --ease: cubic-bezier(.34,1.32,.5,1); --t: .42s; --bg: #000; --fg: #fff; --dim: rgba(255,255,255,.62); --chip: #2c2c2e; --blue: #0a84ff; --green: #30d158; --orange: #ff9f0a; --red: #ff453a; }
@media (prefers-reduced-motion: reduce) { :root { --t: 0s; } }
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; background: transparent; overflow: hidden; font: 13px/1.3 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; color: var(--fg); user-select: none; }
#pill { position: absolute; left: 50%; top: 0; transform: translateX(-50%); background: var(--bg); width: 200px; height: 32px; border-radius: 0 0 16px 16px;
  box-shadow: 0 6px 24px rgba(0,0,0,.35); overflow: hidden; cursor: default; outline: none; will-change: width, height; }
#pill:focus-visible { box-shadow: 0 0 0 2px var(--blue); }
/* over a maximised app (Chrome tabs) the small pill steps aside; it comes back on hover, for a toast or when opened */
#pill { transition: opacity .2s; } #pill.away:not(.open):not(.toast) { opacity: 0; transition: opacity .25s; }
.face { position: absolute; inset: 0; opacity: 0; pointer-events: none; transition: opacity .16s; }
#pill:not(.open):not(.toast) #compact, #pill.open #full, #pill.toast #toastFace { opacity: 1; pointer-events: auto; transition: opacity .2s .1s; }
#compact { display: flex; align-items: center; justify-content: space-between; padding: 0 14px; }
#compact .l, #compact .r { display: flex; align-items: center; gap: 7px; white-space: nowrap; overflow: hidden; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
.dot.pulse { animation: pulse 1.6s ease-in-out infinite; }
.dot.orange { background: var(--orange); } .dot.red { background: var(--red); }
@keyframes pulse { 50% { opacity: .35; } }
.bars { display: inline-flex; gap: 2px; align-items: flex-end; height: 14px; }
.bars i { width: 3px; border-radius: 2px; background: var(--orange); height: 40%; }
.bars.on i { animation: bar .9s ease-in-out infinite; } .bars.on i:nth-child(2) { animation-delay: -.3s; } .bars.on i:nth-child(3) { animation-delay: -.6s; }
@keyframes bar { 50% { height: 100%; } }
.paused .bars i, .idle .dot.pulse, .idle .bars i { animation-play-state: paused; }
#full { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.tabs { display: flex; gap: 6px; }
.tabs button { flex: 1; background: var(--chip); color: var(--dim); border: 0; border-radius: 12px; padding: 6px 0; font: inherit; font-weight: 600; cursor: pointer; }
.tabs button[aria-selected=true] { background: #fff; color: #000; }
.panel { display: none; flex: 1; overflow: auto; } .panel.on { display: block; }
.row { display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 12px; cursor: pointer; }
.row:hover, .row:focus-visible { background: #1c1c1e; outline: none; }
.row .g { flex: 1; min-width: 0; } .row b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row small { color: var(--dim); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stats { display: flex; gap: 8px; margin-bottom: 6px; } .stat { flex: 1; background: var(--chip); border-radius: 14px; padding: 8px 10px; }
.stat b { font-size: 20px; display: block; } .stat small { color: var(--dim); }
.btns { display: flex; gap: 8px; justify-content: center; margin-top: 8px; }
.btn svg { display: block; margin: auto; pointer-events: none; }
.btn { background: var(--chip); color: #fff; border: 0; border-radius: 22px; min-width: 44px; height: 44px; font: 600 15px inherit; cursor: pointer; padding: 0 14px; }
.btn:hover, .btn:focus-visible { background: #3a3a3c; outline: none; } .btn.big { background: #fff; color: #000; }
.muted { color: var(--dim); } h3 { margin: 2px 0 6px; font-size: 13px; color: var(--dim); font-weight: 600; }
.big-time { font: 600 40px "Segoe UI Variable Display", "Segoe UI", sans-serif; text-align: center; margin: 6px 0; }
#toastFace { display: flex; align-items: center; gap: 12px; padding: 0 20px; }
.ico { display: inline-flex; align-items: center; gap: 4px; color: var(--fg); }
.batt { position: relative; width: 24px; height: 12px; border: 1.5px solid rgba(255,255,255,.55); border-radius: 4px; padding: 1px; }
.batt::after { content: ""; position: absolute; right: -4px; top: 3px; width: 2px; height: 4px; border-radius: 0 2px 2px 0; background: rgba(255,255,255,.55); }
.batt i { display: block; height: 100%; border-radius: 2px; background: #fff; }
.batt.low i { background: var(--red); } .batt.chg i { background: var(--green); }
.strip { display: flex; gap: 8px; } .strip .stat { padding: 7px 10px; } .strip .stat b { font-size: 14px; }
input[type=range] { width: 100%; accent-color: #fff; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; font-size: 11px; }
.cal span { padding: 3px 0; border-radius: 8px; color: var(--dim); } .cal b { color: var(--dim); font-weight: 600; font-size: 10px; }
.cal span.in { color: #fff; } .cal span.today { background: var(--orange); color: #000; font-weight: 700; }
.split { display: flex; gap: 14px; } .split > div { flex: 1; }
</style></head>
<body>
<div id="pill" tabindex="0" role="button" aria-label="Coco Island. Press Enter to open." aria-expanded="false">
  <div class="face" id="compact"><div class="l" id="cl"></div><div class="r" id="cr"></div></div>
  <div class="face" id="toastFace"><span class="dot orange"></span><div class="g"><b id="tT"></b><small class="muted" id="tS"></small></div></div>
  <div class="face" id="full">
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="panel" id="p-coco" role="tabpanel"></div>
    <div class="panel" id="p-music" role="tabpanel"></div>
    <div class="panel" id="p-control" role="tabpanel"></div>
    <div class="panel" id="p-focus" role="tabpanel"></div>
  </div>
</div>
<script>
const I = window.cocoIsland;
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pill = $('#pill');
let S = { approvals: [], tasks: {}, sessions: [], doneToday: 0, recentDone: [] }, media = null, battery = null, weather = '', modules = { coco: true, music: true, control: true, focus: true };
let tab = 'coco', open = false, pomo = null, toastTimer = null, net = null, bright = null, charging = false, chargeSecs = Infinity;
const wifiIcon = () => {
  if (!net || !net.on) return '<svg width="16" height="14" viewBox="0 0 24 20" aria-label="No Wi-Fi"><path d="M2 2l20 16" stroke="#ff453a" stroke-width="2.4"/><path d="M12 18l3-4a5 5 0 0 0-6 0z" fill="rgba(255,255,255,.4)"/></svg>';
  const n = net.signal >= 70 ? 3 : net.signal >= 40 ? 2 : 1, op = (i) => (i <= n ? '#fff' : 'rgba(255,255,255,.3)');
  return `<svg width="16" height="13" viewBox="0 0 24 20" aria-label="Wi-Fi ${net.signal}%"><path d="M12 19l3.4-4.2a5.6 5.6 0 0 0-6.8 0z" fill="${op(1)}"/><path d="M5.5 11.2a10 10 0 0 1 13 0l-2.1 2.6a6.7 6.7 0 0 0-8.8 0z" fill="${op(2)}"/><path d="M1 5.6a17 17 0 0 1 22 0l-2.1 2.6a13.7 13.7 0 0 0-17.8 0z" fill="${op(3)}"/></svg>`;
};
const battIcon = () => battery == null ? '' : `<span class="ico">${charging ? '<svg width="9" height="12" viewBox="0 0 10 16" aria-hidden="true"><path d="M6 0 0 9h4l-1 7 7-10H6z" fill="#30d158"/></svg>' : ''}<span>${battery}%</span><span class="batt ${charging ? 'chg' : battery <= 20 ? 'low' : ''}"><i style="width:${Math.max(6, battery)}%"></i></span></span>`;
const statusIcons = () => `<span class="ico">${wifiIcon()}</span>${battIcon()}`;
function monthGrid() {
  const d = new Date(), y = d.getFullYear(), m = d.getMonth(), first = (new Date(y, m, 1).getDay() + 6) % 7, days = new Date(y, m + 1, 0).getDate();
  let h = ['M', 'T', 'W', 'T', 'F', 'S', 'S'].map((x) => `<b>${x}</b>`).join('');
  for (let i = 0; i < first; i++) h += '<span></span>';
  for (let i = 1; i <= days; i++) h += `<span class="in${i === d.getDate() ? ' today' : ''}">${i}</span>`;
  return `<div class="muted" style="margin-bottom:4px">${d.toLocaleDateString([], { month: 'long', year: 'numeric' })}</div><div class="cal">${h}</div>`;
}
const TABS = [['coco', 'Coco'], ['music', 'Music'], ['control', 'Control'], ['focus', 'Focus']];

// ---- size: Bloom's springs (width 400/31, height 450/29, corners 1000/40), run only while moving ----
const SIZES = { compact: [200, 32, 16], open: [440, 292, 30], toast: [360, 62, 30] };
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const SPR = [[400, 31], [450, 29], [1000, 40]];
let cur = [...SIZES.compact], vel = [0, 0, 0], goal = [...SIZES.compact], raf = 0, lastT = 0;
function mode(m) {
  goal = [...SIZES[m]];
  pill.classList.toggle('open', m === 'open'); pill.classList.toggle('toast', m === 'toast');
  I.rect({ w: goal[0], h: goal[1] });   // main uses it to keep clicks on the pill and to know when the pointer left
  if (reduced) { cur = [...goal]; paint(); return; }
  if (!raf) { lastT = performance.now(); raf = requestAnimationFrame(step); }
}
function paint() { pill.style.width = cur[0] + 'px'; pill.style.height = cur[1] + 'px'; pill.style.borderRadius = `0 0 ${cur[2]}px ${cur[2]}px`; }
function step(t) {
  const dt = Math.min(0.032, (t - lastT) / 1000); lastT = t; let moving = false;
  for (let i = 0; i < 3; i++) {
    const [k, c] = SPR[i];
    vel[i] += (k * (goal[i] - cur[i]) - c * vel[i]) * dt; cur[i] += vel[i] * dt;
    if (Math.abs(goal[i] - cur[i]) > 0.3 || Math.abs(vel[i]) > 0.3) moving = true; else { cur[i] = goal[i]; vel[i] = 0; }
  }
  paint();
  raf = moving ? requestAnimationFrame(step) : 0;   // idle = no frames at all
}
paint();

// ---- hover: Coco Lounge watches the pointer (top-centre band, Bloom's 200 ms dwell) and tells the island ----
I.onHover((v) => setOpen(v));
pill.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target === pill) setOpen(!open); if (e.key === 'Escape') { setOpen(false); I.blur(); } });

function setOpen(v) {
  if (v === open) return; open = v;
  pill.setAttribute('aria-expanded', v);
  if (v) renderFull();
  mode(v ? 'open' : 'compact');
}

// ---- compact: the most important thing first (approval > music > working agents > clock) ----
// Only touch the DOM when the text changed, so the bars and dots keep animating smoothly.
const set = (el, h) => { if (el._h !== h) { el.innerHTML = h; el._h = h; } };
function renderCompact() {
  const l = $('#cl'), r = $('#cr');
  const working = S.sessions.length + (S.tasks.working || 0);
  if (modules.coco && S.approvals.length) { set(l, `<span class="dot orange pulse"></span><span>${S.approvals.length} approval${S.approvals.length > 1 ? 's' : ''}</span>`); set(r, `<span class="muted">YES?</span>`); }
  else if (modules.music && media && media.playing) { set(l, `<span aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3v10.6A4 4 0 1 0 14 17V7h4V3z"/></svg></span><span style="max-width:110px;overflow:hidden;text-overflow:ellipsis">${esc(media.title)}</span>`); set(r, '<span class="bars on"><i></i><i></i><i></i></span>'); }
  else if (pomo) { const left = Math.max(0, pomo.end - Date.now()); set(l, `<span class="dot ${pomo.brk ? '' : 'orange'}"></span><span>${pomo.brk ? 'Break' : 'Focus'}</span>`); set(r, `<span style="color:var(--orange)">${fmt(left)}</span>`); }
  else if (modules.coco && working) { set(l, `<span class="dot pulse"></span><span>${working} working</span>`); set(r, `<span class="muted">${S.doneToday} done</span>`); }
  else { set(l, `<span>${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span><span class="muted">${esc(weather)}</span>`); set(r, statusIcons()); }
  pill.setAttribute('aria-label', 'Coco Island: ' + $('#compact').innerText.replace(/\s+/g, ' ') + '. Press Enter to open.');
}
const fmt = (ms) => { const s = Math.round(ms / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };

// ---- expanded ----
function renderFull() {
  const shown = TABS.filter(([k]) => modules[k]); if (!shown.some(([k]) => k === tab)) tab = (shown[0] || ['coco'])[0];
  $('#tabs').innerHTML = shown.map(([k, n]) => `<button role="tab" aria-selected="${k === tab}" data-tab="${k}">${n}</button>`).join('');
  document.querySelectorAll('.panel').forEach((p) => p.classList.toggle('on', p.id === 'p-' + tab));
  if (tab === 'coco') {
    $('#p-coco').innerHTML = `<div class="stats"><div class="stat"><b>${S.sessions.length + (S.tasks.working || 0)}</b><small>working</small></div><div class="stat"><b>${S.tasks.queued || 0}</b><small>queued</small></div><div class="stat"><b>${S.approvals.length}</b><small>approvals</small></div><div class="stat"><b>${S.doneToday}</b><small>done today</small></div></div>`
      + (S.approvals.length ? '<h3>Waiting for your YES</h3>' + S.approvals.slice(0, 4).map((a) => `<div class="row" tabindex="0" data-open="approvals"><span class="dot orange"></span><div class="g"><b>${esc(a.code)} · ${esc(a.team)}</b><small>${esc(a.what)}</small></div></div>`).join('') : '')
      + (S.sessions.length ? '<h3>Claude at work</h3>' + S.sessions.slice(0, 3).map((s) => `<div class="row" tabindex="0" data-open="board"><span class="dot pulse"></span><div class="g"><b>${esc(s.now)}</b><small>${esc(s.ago)}</small></div></div>`).join('') : '')
      + (S.recentDone.length ? '<h3>Done</h3>' + S.recentDone.slice(0, 3).map((t) => `<div class="row" tabindex="0" data-open="board"><span class="dot"></span><div class="g"><b>${esc(t)}</b></div></div>`).join('') : '')
      + (!S.approvals.length && !S.sessions.length && !S.recentDone.length ? '<p class="muted">All quiet. Nothing waits for you.</p>' : '');
  }
  if (tab === 'music') $('#p-music').innerHTML = media && !media.none
    ? `<div class="row"><span class="bars ${media.playing ? 'on' : ''}"><i></i><i></i><i></i></span><div class="g"><b>${esc(media.title)}</b><small>${esc(media.artist || media.app)}</small></div></div><div class="btns"><button class="btn" data-media="prev" aria-label="Previous"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button><button class="btn big" data-media="playpause" aria-label="Play or pause">${media.playing ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>' : '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>'}</button><button class="btn" data-media="next" aria-label="Next"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button></div>`
    : '<p class="muted">Nothing is playing.</p><div class="btns"><button class="btn big" data-media="playpause" aria-label="Play"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg></button></div>';
  if (tab === 'control') $('#p-control').innerHTML = `<div class="strip"><div class="stat"><small>Wi-Fi</small><b>${net && net.on ? esc(net.ssid) + ' · ' + net.signal + '%' : 'Off'}</b></div><div class="stat"><small>${charging ? 'Charging' : 'Battery'}</small><b>${battery != null ? battery + '%' : '—'}${isFinite(chargeSecs) && chargeSecs > 0 ? ' · ' + Math.round(chargeSecs / 60) + ' min' + (charging ? ' to full' : ' left') : ''}</b></div></div>
    ${bright != null ? `<h3 style="margin-top:10px">Brightness ${bright}%</h3><input type="range" min="0" max="100" value="${bright}" id="bright" aria-label="Brightness">` : ''}
    <h3>Sound</h3><div class="btns"><button class="btn" data-vol="down" aria-label="Volume down">−</button><button class="btn" data-vol="mute" aria-label="Mute"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.6 3 2.7-2.7-1.4-1.4-2.7 2.7-2.7-2.7-1.4 1.4 2.7 2.7-2.7 2.7 1.4 1.4 2.7-2.7 2.7 2.7 1.4-1.4z"/></svg></button><button class="btn" data-vol="up" aria-label="Volume up">+</button></div>
    <h3 style="margin-top:12px">Shortcuts</h3><div class="btns"><button class="btn" data-set="ms-settings:network-wifi">Wi-Fi</button><button class="btn" data-set="ms-settings:bluetooth">Bluetooth</button><button class="btn" data-set="ms-settings:display">Display</button><button class="btn" data-set="ms-settings:batterysaver">Battery</button></div>
    `;
  if (tab === 'focus') $('#p-focus').innerHTML = `<div class="split"><div>${monthGrid()}</div><div>` + (pomo
    ? `<div class="big-time" style="color:${pomo.brk ? 'var(--green)' : 'var(--orange)'}">${fmt(Math.max(0, pomo.end - Date.now()))}</div><p class="muted" style="text-align:center">${pomo.brk ? 'Break' : 'Focus'} · round ${pomo.round}</p><div class="btns"><button class="btn" data-pomo="stop">Stop</button></div>`
    : `<div class="big-time">25:00</div><p class="muted" style="text-align:center">25 min focus, 5 min break</p><div class="btns"><button class="btn big" data-pomo="start">Start</button></div>`) + '</div></div>';
}

pill.addEventListener('click', (e) => {
  const t = e.target.closest('[data-tab],[data-open],[data-media],[data-vol],[data-set],[data-pomo]'); if (!t) return;
  const d = t.dataset;
  if (d.tab) { tab = d.tab; renderFull(); }
  if (d.open) { I.openCoco(d.open); I.close(); }
  if (d.media) I.act('media', { key: d.media });
  if (d.vol) I.act('volume', { key: d.vol, steps: 2 });
  if (d.set) I.openSettings(d.set);
  if (d.pomo === 'start') startPomo(false, 1);
  if (d.pomo === 'stop') { pomo = null; renderFull(); renderCompact(); }
});
pill.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target !== pill) e.target.click(); });
pill.addEventListener('change', (e) => { if (e.target.id === 'bright') I.act('bright', { level: Number(e.target.value) }); });
let wheelAt = 0;
pill.addEventListener('wheel', (e) => {
  if (!open || e.target.closest('.panel') && e.target.closest('.panel').scrollHeight > e.target.closest('.panel').clientHeight) return;
  if (Date.now() - wheelAt < 300) return; wheelAt = Date.now();
  const shown = TABS.filter(([k]) => modules[k]).map(([k]) => k), i = shown.indexOf(tab);
  tab = shown[(i + (e.deltaY > 0 || e.deltaX > 0 ? 1 : -1) + shown.length) % shown.length]; renderFull();
}, { passive: true });

function startPomo(brk, round) { pomo = { brk, round, end: Date.now() + (brk ? 5 : 25) * 60000 }; renderFull(); renderCompact(); }

// ---- toasts: a new approval or a finished job, like a phone notification ----
function toast(title, sub, color) {
  $('#tT').textContent = title; $('#tS').textContent = sub;
  $('#toastFace .dot').className = 'dot ' + (color === 'green' ? '' : 'orange');
  if (!open) mode('toast');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { if (!open) mode('compact'); }, 4500);
}

// ---- data in ----
let seenApprovals = null, seenDone = null;
I.onData((d) => {
  const ids = new Set(d.approvals.map((a) => a.id));
  if (seenApprovals) for (const a of d.approvals) if (!seenApprovals.has(a.id)) toast('Approval needed', a.code + ' · ' + a.what);
  if (seenDone != null && d.doneToday > seenDone && d.recentDone[0]) toast('Job done', d.recentDone[0]);
  seenApprovals = ids; seenDone = d.doneToday; S = d; renderCompact(); if (open) renderFull();
});
I.onMedia((m) => { media = m.none ? null : m; renderCompact(); if (open && tab === 'music') renderFull(); });
I.onModules((m) => { modules = m; renderCompact(); if (open) renderFull(); });

// Battery and weather: battery from Chromium; weather once an hour from Open-Meteo (no key), place from the IP once.
navigator.getBattery?.().then((b) => {
  const up = (plug) => {
    const was = charging; battery = Math.round(b.level * 100); charging = b.charging; chargeSecs = charging ? b.chargingTime : b.dischargingTime;
    if (plug && was !== charging) toast(charging ? 'Charging' : 'On battery', battery + '%' + (charging ? ' ⚡' : ''), charging ? 'green' : '');
    renderCompact(); if (open && tab === 'control') renderFull();
  };
  up(false);
  b.addEventListener('levelchange', () => up(false)); b.addEventListener('chargingchange', () => up(true));
  b.addEventListener('chargingtimechange', () => up(false)); b.addEventListener('dischargingtimechange', () => up(false));
});
I.onSys((m) => { if (m.t === 'max') pill.classList.toggle('away', !!m.on); if (m.t === 'net') net = m; if (m.t === 'bright') bright = m.level; renderCompact(); if (open && tab === 'control' && document.activeElement?.id !== 'bright') renderFull(); });
async function loadWeather() {
  try {
    const loc = await (await fetch('https://ipapi.co/json/')).json();
    const w = await (await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${loc.latitude}&longitude=${loc.longitude}&current=temperature_2m`)).json();
    weather = Math.round(w.current.temperature_2m) + '°';
  } catch { weather = ''; }
  renderCompact();
}
loadWeather(); setInterval(loadWeather, 3600000);

// One clock tick a second only while something on screen counts (focus timer) or the clock shows; idle otherwise.
setInterval(() => {
  if (pomo && Date.now() >= pomo.end) { const brk = !pomo.brk; I.act('notify', { text: brk ? 'Focus done. Take 5.' : 'Break over. Back to focus.' }); startPomo(brk, pomo.round + (brk ? 0 : 1)); }
  if (!document.hidden) { renderCompact(); if (open && tab === 'focus') renderFull(); }
}, 1000);
renderCompact();
</script>
