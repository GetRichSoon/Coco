<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7b4f6b">
<title>Coco</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="coco.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<aside class="rail">
  <div class="brand"><img src="coco.svg" alt=""><span>Coco</span></div>
  <nav id="nav"></nav>
</aside>
<main>
  <header class="top">
    <div>
      <p class="hello" id="hello">Hello</p>
      <h1 id="title">Home</h1>
    </div>
    <div class="who">
      <select id="who" aria-label="Who is using Coco">
        <option value="mangesh">Boss (Mangesh)</option>
        <option value="shreya">Big Boss (Shreya)</option>
      </select>
      <button class="icon" id="refresh" title="Read Nova again">↻</button>
    </div>
  </header>
  <section id="view" aria-live="polite"></section>
</main>
<nav class="bottom" id="bottom"></nav>
<dialog id="pin">
  <form method="dialog">
    <h2>Coco PIN</h2>
    <p>Find it on the PC in <b>Coco Vault › Coco Keys › Coco App PIN.txt</b>.</p>
    <input id="pinInput" inputmode="numeric" autocomplete="one-time-code" maxlength="6">
    <button class="filled">Open Coco</button>
  </form>
</dialog>
<div id="toast" role="status"></div>
<script src="app.js"></script>
</body>
</html>
