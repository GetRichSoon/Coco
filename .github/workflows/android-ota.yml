# Over-the-air updates for the Coco Lounge phone app: no store, no cable, no Supabase storage.
# A push that touches the Android app builds it with the same debug key the phones already run
# (ANDROID_DEBUG_KEYSTORE_BASE64, the pattern android.yml already uses) and publishes the APK as a
# GitHub release of this public repository, sha256 in the notes. Nova serves the latest release at
# /api/apk/latest to a paired device; the phone checks the sha256 before Android installs. No bucket,
# no storage secret, no link committed into the tree.
name: android ota

on:
  push:
    branches: [cloud-foundation]
    paths: ['Lounge Android/app/**', 'Lounge Android/scripts/**', 'Lounge/release.json', '.github/workflows/android-ota.yml']
  workflow_dispatch:

concurrency:
  group: android-ota
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ota:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: one Coco version across all four clients
        run: node Lounge/release.test.js
      - name: the phones' debug key, so this build installs over what they run
        env:
          DEBUG_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          test -n "$DEBUG_B64" || { echo "ANDROID_DEBUG_KEYSTORE_BASE64 is not set"; exit 1; }
          mkdir -p ~/.android && printf '%s' "$DEBUG_B64" | base64 -d > ~/.android/debug.keystore && test -s ~/.android/debug.keystore
      - name: build
        working-directory: 'Lounge Android'
        run: ./gradlew assembleDebug --no-daemon -q
      - name: publish the APK as a GitHub release (tag android-<version>-<code>, sha256 in the notes)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          meta=$(node "Lounge Android/scripts/ota-publish.mjs" "Lounge Android/app/build/outputs/apk/debug/app-debug.apk")
          echo "$meta"
          code=$(echo "$meta" | node -e "process.stdin.on('data',d=>console.log(JSON.parse(d).versionCode))")
          name=$(echo "$meta" | node -e "process.stdin.on('data',d=>console.log(JSON.parse(d).versionName))")
          sha=$(echo "$meta" | node -e "process.stdin.on('data',d=>console.log(JSON.parse(d).sha256))")
          cp "Lounge Android/app/build/outputs/apk/debug/app-debug.apk" "coco-lounge-$code.apk"
          gh release delete "android-$name-$code" -y --cleanup-tag 2>/dev/null || true
          printf 'versionCode %s\nsha256 %s\nBuilt by android-ota from %s with the phones debug key. Installed by the app itself after a checksum.\n' "$code" "$sha" "$GITHUB_SHA" > notes.txt
          gh release create "android-$name-$code" "coco-lounge-$code.apk" --target "$GITHUB_SHA" --title "Coco Lounge $name ($code)" --notes-file notes.txt
