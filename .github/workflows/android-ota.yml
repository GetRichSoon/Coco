# Over-the-air updates for the Coco Lounge phone app: no store, no cable, no Supabase storage.
# A push that touches the Android app builds it with the same debug key the phones already run
# (ANDROID_DEBUG_KEYSTORE_BASE64, the pattern android.yml already uses), uploads the APK to B2 and
# commits Lounge/ota/latest.json holding only the version, the storage key and the sha256. Nova serves
# that at /api/apk/latest with a short-lived download link for a paired device; the phone checks the
# sha256 before Android installs. Nothing downloadable is ever written into this public repository.
name: android ota

on:
  push:
    branches: [cloud-foundation]
    paths: ['Lounge Android/app/**', 'Lounge Android/scripts/**', 'Lounge/release.json', '.github/workflows/android-ota.yml']
  workflow_dispatch:

concurrency:
  group: android-ota
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ota:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: one Coco version across all four clients
        run: node Lounge/release.test.js
      - name: the phones' debug key, so this build installs over what they run
        env:
          DEBUG_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          test -n "$DEBUG_B64" || { echo "ANDROID_DEBUG_KEYSTORE_BASE64 is not set"; exit 1; }
          mkdir -p ~/.android && printf '%s' "$DEBUG_B64" | base64 -d > ~/.android/debug.keystore && test -s ~/.android/debug.keystore
      - name: build
        working-directory: 'Lounge Android'
        run: ./gradlew assembleDebug --no-daemon -q
      - name: publish the APK to B2 and write the release pointer (version, key, sha256; no link)
        env:
          STORAGE_PROVIDER: b2
          STORAGE_ENDPOINT: ${{ secrets.STORAGE_ENDPOINT }}
          STORAGE_REGION: ${{ secrets.STORAGE_REGION }}
          STORAGE_BUCKET: ${{ secrets.STORAGE_BUCKET }}
          STORAGE_ACCESS_KEY_ID: ${{ secrets.STORAGE_ACCESS_KEY_ID }}
          STORAGE_SECRET_ACCESS_KEY: ${{ secrets.STORAGE_SECRET_ACCESS_KEY }}
          STORAGE_VERSIONED: '1'
        run: node "Lounge Android/scripts/ota-publish.mjs" "Lounge Android/app/build/outputs/apk/debug/app-debug.apk"
      - name: commit the release pointer
        run: |
          git config user.name "coco-cloud" && git config user.email "coco-cloud@users.noreply.github.com"
          git add Lounge/ota/latest.json
          git diff --cached --quiet || git commit -m "android ota: $(node -e "const m=require('./Lounge/ota/latest.json');console.log(m.versionName+' ('+m.versionCode+')')") [skip ci]"
          git push
