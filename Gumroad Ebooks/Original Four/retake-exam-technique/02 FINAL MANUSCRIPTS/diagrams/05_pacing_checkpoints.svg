<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 876" width="800" height="876"><rect width="800" height="876" fill="#f4efe6"/><text x="400.0" y="50" font-family="Georgia, 'Segoe UI', serif" font-size="30" fill="#0f2238" text-anchor="middle" font-weight="bold">Pacing: 100 questions in 150 minutes</text><rect x="330.0" y="68" width="140" height="5" rx="0" fill="#8a4f1c"/><rect x="40" y="104" width="720" height="94" rx="12" fill="#0f2238"/><text x="58" y="141" font-family="Georgia, 'Segoe UI', serif" font-size="23" fill="#f4efe6" text-anchor="start">Keep 10 minutes for review: 140 minutes / 100</text><text x="58" y="173" font-family="Georgia, 'Segoe UI', serif" font-size="23" fill="#f4efe6" text-anchor="start">questions = 1.4 minutes = 84 seconds each.</text><rect x="50" y="278" width="653.3333333333334" height="56" rx="0" fill="#1d6f6b"/><rect x="703.3333333333334" y="278" width="46.66666666666667" height="56" rx="0" fill="#8a4f1c"/><text x="50" y="264" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#0f2238" text-anchor="start" font-weight="bold">Start</text><line x1="213.3" y1="272" x2="213.3" y2="340" stroke="#0f2238" stroke-width="4"/><text x="213.3" y="264" font-family="Georgia, 'Segoe UI', serif" font-size="24" fill="#0f2238" text-anchor="middle" font-weight="bold">Q25</text><text x="213.3" y="370" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#0f2238" text-anchor="middle">35 min</text><line x1="376.7" y1="272" x2="376.7" y2="340" stroke="#0f2238" stroke-width="4"/><text x="376.7" y="264" font-family="Georgia, 'Segoe UI', serif" font-size="24" fill="#0f2238" text-anchor="middle" font-weight="bold">Q50</text><text x="376.7" y="370" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#0f2238" text-anchor="middle">70 min</text><line x1="540.0" y1="272" x2="540.0" y2="340" stroke="#0f2238" stroke-width="4"/><text x="540.0" y="264" font-family="Georgia, 'Segoe UI', serif" font-size="24" fill="#0f2238" text-anchor="middle" font-weight="bold">Q75</text><text x="540.0" y="370" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#0f2238" text-anchor="middle">105 min</text><line x1="703.3" y1="272" x2="703.3" y2="340" stroke="#0f2238" stroke-width="4"/><text x="703.3" y="264" font-family="Georgia, 'Segoe UI', serif" font-size="24" fill="#0f2238" text-anchor="end" font-weight="bold">Q100</text><text x="703.3" y="370" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#0f2238" text-anchor="end">140 min</text><text x="750.0" y="406" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#8a4f1c" text-anchor="end" font-weight="bold">Last 10 minutes: review buffer</text><rect x="40" y="428" width="720" height="154" rx="12" fill="#ffffff" stroke="#0f2238" stroke-width="3"/><text x="58" y="464" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#0f2238" text-anchor="start">Teal: answering time, 140 min. Copper: review buffer,</text><text x="58" y="495" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#0f2238" text-anchor="start">10 min.</text><text x="58" y="526" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#0f2238" text-anchor="start">Counting down instead? Time remaining at each</text><text x="58" y="557" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#0f2238" text-anchor="start">checkpoint: 115, 80, 45, 10 minutes.</text><rect x="40" y="602" width="350" height="250" rx="12" fill="#0f2238"/><text x="58" y="642" font-family="Georgia, 'Segoe UI', serif" font-size="26" fill="#f4efe6" text-anchor="start" font-weight="bold">THE SKIP RULE</text><text x="58" y="676" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#f4efe6" text-anchor="start">The hard question has had</text><text x="58" y="707" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#f4efe6" text-anchor="start">its time (about 84</text><text x="58" y="738" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#f4efe6" text-anchor="start">seconds) and you are no</text><text x="58" y="769" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#f4efe6" text-anchor="start">closer? Eliminate, choose</text><text x="58" y="800" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#f4efe6" text-anchor="start">the best option, FLAG,</text><text x="58" y="831" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#f4efe6" text-anchor="start">move.</text><rect x="410" y="602" width="350" height="250" rx="12" fill="#1d6f6b"/><text x="428" y="642" font-family="Georgia, 'Segoe UI', serif" font-size="26" fill="#f4efe6" text-anchor="start" font-weight="bold">AT EACH CHECKPOINT</text><text x="428" y="676" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#f4efe6" text-anchor="start">On pace or ahead: same</text><text x="428" y="707" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#f4efe6" text-anchor="start">method. Behind: be strict</text><text x="428" y="738" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#f4efe6" text-anchor="start">on the hard ones, not</text><text x="428" y="769" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#f4efe6" text-anchor="start">careless on the easy</text><text x="428" y="800" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#f4efe6" text-anchor="start">ones.</text></svg>