<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 977" width="800" height="977"><rect width="800" height="977" fill="#f4efe6"/><text x="400.0" y="50" font-family="Georgia, 'Segoe UI', serif" font-size="30" fill="#0f2238" text-anchor="middle" font-weight="bold">One rule per qualifier</text><rect x="330.0" y="68" width="140" height="5" rx="0" fill="#8a4f1c"/><rect x="40" y="104" width="350" height="378" rx="12" fill="#ffffff" stroke="#0f2238" stroke-width="3"/><text x="58" y="148" font-family="Georgia, 'Segoe UI', serif" font-size="30" fill="#0f2238" text-anchor="start" font-weight="bold">FIRST</text><text x="58" y="186" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#0f2238" text-anchor="start">Danger in the stem?</text><text x="58" y="217" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#0f2238" text-anchor="start">Remove it. No danger?</text><text x="58" y="248" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#0f2238" text-anchor="start">Gather information before</text><text x="58" y="279" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#0f2238" text-anchor="start">anything you cannot undo.</text><text x="58" y="310" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#0f2238" text-anchor="start">Ask: if I skip this</text><text x="58" y="341" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#0f2238" text-anchor="start">option, do the others</text><text x="58" y="372" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#0f2238" text-anchor="start">become unsafe, pointless</text><text x="58" y="403" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#0f2238" text-anchor="start">or impossible?</text><text x="58" y="434" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#0f2238" text-anchor="start">Trap: the most important</text><text x="58" y="465" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#0f2238" text-anchor="start">action, not the earliest.</text><rect x="410" y="104" width="350" height="378" rx="12" fill="#ffffff" stroke="#0f2238" stroke-width="3"/><text x="428" y="148" font-family="Georgia, 'Segoe UI', serif" font-size="30" fill="#0f2238" text-anchor="start" font-weight="bold">NEXT</text><text x="428" y="186" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#0f2238" text-anchor="start">Where are you in the</text><text x="428" y="217" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#0f2238" text-anchor="start">sequence? The very next</text><text x="428" y="248" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#0f2238" text-anchor="start">step: not the first</text><text x="428" y="279" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#0f2238" text-anchor="start">again, not two steps on.</text><text x="428" y="310" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#0f2238" text-anchor="start">Ask: what has already</text><text x="428" y="341" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#0f2238" text-anchor="start">happened?</text><text x="428" y="372" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#0f2238" text-anchor="start">Trap: the satisfying</text><text x="428" y="403" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#0f2238" text-anchor="start">later step.</text><rect x="40" y="498" width="350" height="347" rx="12" fill="#ffffff" stroke="#0f2238" stroke-width="3"/><text x="58" y="542" font-family="Georgia, 'Segoe UI', serif" font-size="30" fill="#0f2238" text-anchor="start" font-weight="bold">BEST</text><text x="58" y="580" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#0f2238" text-anchor="start">Several options are</text><text x="58" y="611" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#0f2238" text-anchor="start">acceptable. The best</text><text x="58" y="642" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#0f2238" text-anchor="start">meets every goal and</text><text x="58" y="673" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#0f2238" text-anchor="start">every limit the stem</text><text x="58" y="704" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#0f2238" text-anchor="start">states.</text><text x="58" y="735" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#0f2238" text-anchor="start">Ask: which option meets</text><text x="58" y="766" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#0f2238" text-anchor="start">all of them?</text><text x="58" y="797" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#0f2238" text-anchor="start">Trap: great on one goal,</text><text x="58" y="828" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#0f2238" text-anchor="start">ignores another.</text><rect x="410" y="498" width="350" height="347" rx="12" fill="#ffffff" stroke="#0f2238" stroke-width="3"/><text x="428" y="542" font-family="Georgia, 'Segoe UI', serif" font-size="30" fill="#0f2238" text-anchor="start" font-weight="bold">MOST LIKELY</text><text x="428" y="580" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#0f2238" text-anchor="start">Fits every fact in the</text><text x="428" y="611" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#0f2238" text-anchor="start">stem. The common cause,</text><text x="428" y="642" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#0f2238" text-anchor="start">not the rare or dramatic</text><text x="428" y="673" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#0f2238" text-anchor="start">one.</text><text x="428" y="704" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#0f2238" text-anchor="start">Ask: which fits without</text><text x="428" y="735" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#0f2238" text-anchor="start">facts I add?</text><text x="428" y="766" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#0f2238" text-anchor="start">Trap: the striking,</text><text x="428" y="797" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#0f2238" text-anchor="start">memorable answer.</text><rect x="40" y="861" width="720" height="92" rx="12" fill="#8a4f1c"/><text x="58" y="897" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#f4efe6" text-anchor="start">LEAST, EXCEPT, NOT: sort each option into 'fits' or</text><text x="58" y="928" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#f4efe6" text-anchor="start">'does not fit'. The odd one out is the answer.</text></svg>