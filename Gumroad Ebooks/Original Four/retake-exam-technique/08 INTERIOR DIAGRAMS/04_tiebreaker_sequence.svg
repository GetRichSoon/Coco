<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 946" width="800" height="946"><rect width="800" height="946" fill="#f4efe6"/><text x="400.0" y="50" font-family="Georgia, 'Segoe UI', serif" font-size="30" fill="#0f2238" text-anchor="middle" font-weight="bold">Two options left: the tie-breaker sequence</text><rect x="330.0" y="68" width="140" height="5" rx="0" fill="#8a4f1c"/><rect x="40" y="104" width="720" height="90" rx="12" fill="#0f2238"/><text x="56" y="140" font-family="Georgia, 'Segoe UI', serif" font-size="24" fill="#f4efe6" text-anchor="start" font-weight="bold">1  What exactly is this asking? (Say the lead-in in</text><text x="56" y="172" font-family="Georgia, 'Segoe UI', serif" font-size="24" fill="#f4efe6" text-anchor="start" font-weight="bold">your own words.)</text><rect x="40" y="206" width="720" height="90" rx="12" fill="#0f2238"/><text x="56" y="242" font-family="Georgia, 'Segoe UI', serif" font-size="24" fill="#f4efe6" text-anchor="start" font-weight="bold">2  What is the qualifier, and what does its rule</text><text x="56" y="274" font-family="Georgia, 'Segoe UI', serif" font-size="24" fill="#f4efe6" text-anchor="start" font-weight="bold">say?</text><rect x="40" y="308" width="720" height="58" rx="12" fill="#0f2238"/><text x="56" y="344" font-family="Georgia, 'Segoe UI', serif" font-size="24" fill="#f4efe6" text-anchor="start" font-weight="bold">3  Which option uses every fact in the stem?</text><rect x="40" y="378" width="720" height="58" rx="12" fill="#0f2238"/><text x="56" y="414" font-family="Georgia, 'Segoe UI', serif" font-size="24" fill="#f4efe6" text-anchor="start" font-weight="bold">4  Is one of these inside the other?</text><rect x="40" y="448" width="720" height="90" rx="12" fill="#0f2238"/><text x="56" y="484" font-family="Georgia, 'Segoe UI', serif" font-size="24" fill="#f4efe6" text-anchor="start" font-weight="bold">5  Does either need an assumption the stem does not</text><text x="56" y="516" font-family="Georgia, 'Segoe UI', serif" font-size="24" fill="#f4efe6" text-anchor="start" font-weight="bold">give?</text><rect x="40" y="550" width="720" height="90" rx="12" fill="#0f2238"/><text x="56" y="586" font-family="Georgia, 'Segoe UI', serif" font-size="24" fill="#f4efe6" text-anchor="start" font-weight="bold">6  Is either extreme, where the situation calls for</text><text x="56" y="618" font-family="Georgia, 'Segoe UI', serif" font-size="24" fill="#f4efe6" text-anchor="start" font-weight="bold">judgement?</text><rect x="40" y="652" width="720" height="90" rx="12" fill="#0f2238"/><text x="56" y="688" font-family="Georgia, 'Segoe UI', serif" font-size="24" fill="#f4efe6" text-anchor="start" font-weight="bold">7  Can I defend each in one sentence, using only</text><text x="56" y="720" font-family="Georgia, 'Segoe UI', serif" font-size="24" fill="#f4efe6" text-anchor="start" font-weight="bold">the stem?</text><rect x="40" y="754" width="720" height="58" rx="12" fill="#1d6f6b"/><text x="56" y="790" font-family="Georgia, 'Segoe UI', serif" font-size="24" fill="#f4efe6" text-anchor="start" font-weight="bold">8  Choose, flag, move.</text><rect x="40" y="830" width="720" height="92" rx="12" fill="#8a4f1c"/><text x="58" y="866" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#f4efe6" text-anchor="start">Stop at the first step that separates the two. If none</text><text x="58" y="897" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#f4efe6" text-anchor="start">does, step 8.</text></svg>