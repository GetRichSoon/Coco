<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 957" width="800" height="957"><rect width="800" height="957" fill="#f4efe6"/><text x="400.0" y="50" font-family="Georgia, 'Segoe UI', serif" font-size="30" fill="#0f2238" text-anchor="middle" font-weight="bold">The reading routine: the same six steps on</text><text x="400.0" y="90" font-family="Georgia, 'Segoe UI', serif" font-size="30" fill="#0f2238" text-anchor="middle" font-weight="bold">every question</text><rect x="330.0" y="108" width="140" height="5" rx="0" fill="#8a4f1c"/><rect x="40" y="144" width="720" height="96" rx="12" fill="#0f2238"/><text x="58" y="185" font-family="Georgia, 'Segoe UI', serif" font-size="27" fill="#f4efe6" text-anchor="start" font-weight="bold">1  Read the lead-in first</text><text x="58" y="220" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#f4efe6" text-anchor="start">Know what you are looking for before the story.</text><rect x="40" y="254" width="720" height="96" rx="12" fill="#0f2238"/><text x="58" y="295" font-family="Georgia, 'Segoe UI', serif" font-size="27" fill="#f4efe6" text-anchor="start" font-weight="bold">2  Find the qualifier, say it</text><text x="58" y="330" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#f4efe6" text-anchor="start">FIRST, NEXT, BEST, MOST LIKELY, LEAST, EXCEPT, NOT.</text><rect x="40" y="364" width="720" height="96" rx="12" fill="#0f2238"/><text x="58" y="405" font-family="Georgia, 'Segoe UI', serif" font-size="27" fill="#f4efe6" text-anchor="start" font-weight="bold">3  Read the stem once, carefully</text><text x="58" y="440" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#f4efe6" text-anchor="start">Every fact is evidence: who, what, when, what is done.</text><rect x="40" y="474" width="720" height="96" rx="12" fill="#1d6f6b"/><text x="58" y="515" font-family="Georgia, 'Segoe UI', serif" font-size="27" fill="#f4efe6" text-anchor="start" font-weight="bold">4  Predict an answer in your own words</text><text x="58" y="550" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#f4efe6" text-anchor="start">Before you look at the options. Rough is fine.</text><rect x="40" y="584" width="720" height="96" rx="12" fill="#0f2238"/><text x="58" y="625" font-family="Georgia, 'Segoe UI', serif" font-size="27" fill="#f4efe6" text-anchor="start" font-weight="bold">5  Read every option, all the way</text><text x="58" y="660" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#f4efe6" text-anchor="start">Even if the first one looks right.</text><rect x="40" y="694" width="720" height="127" rx="12" fill="#0f2238"/><text x="58" y="735" font-family="Georgia, 'Segoe UI', serif" font-size="27" fill="#f4efe6" text-anchor="start" font-weight="bold">6  Choose the match</text><text x="58" y="770" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#f4efe6" text-anchor="start">The option that fits your prediction and answers the</text><text x="58" y="801" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#f4efe6" text-anchor="start">lead-in.</text><rect x="40" y="841" width="720" height="92" rx="12" fill="#8a4f1c"/><text x="58" y="877" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#f4efe6" text-anchor="start">Step 4 does the most work: predict first, so the</text><text x="58" y="908" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#f4efe6" text-anchor="start">distractors cannot do your thinking.</text></svg>