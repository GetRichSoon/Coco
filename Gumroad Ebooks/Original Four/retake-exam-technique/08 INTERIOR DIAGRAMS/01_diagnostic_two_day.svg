<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1163" width="800" height="1163"><rect width="800" height="1163" fill="#f4efe6"/><text x="400.0" y="50" font-family="Georgia, 'Segoe UI', serif" font-size="30" fill="#0f2238" text-anchor="middle" font-weight="bold">Which gap is biggest? The two-day</text><text x="400.0" y="90" font-family="Georgia, 'Segoe UI', serif" font-size="30" fill="#0f2238" text-anchor="middle" font-weight="bold">diagnostic</text><rect x="330.0" y="108" width="140" height="5" rx="0" fill="#8a4f1c"/><rect x="40" y="144" width="720" height="219" rx="12" fill="#0f2238"/><text x="58" y="184" font-family="Georgia, 'Segoe UI', serif" font-size="26" fill="#f4efe6" text-anchor="start" font-weight="bold">DAY ONE: UNTIMED SET</text><text x="58" y="218" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#f4efe6" text-anchor="start">For each wrong answer, and each right answer you marked</text><text x="58" y="249" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#f4efe6" text-anchor="start">'guessing', ask in order. Stop at the first yes:</text><text x="58" y="280" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#f4efe6" text-anchor="start">1  Misread the question? READING</text><text x="58" y="311" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#f4efe6" text-anchor="start">2  Did not know the fact? KNOWLEDGE</text><text x="58" y="342" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#f4efe6" text-anchor="start">3  Knew it, picked the other plausible option? DECISION</text><rect x="40" y="381" width="720" height="188" rx="12" fill="#1d6f6b"/><text x="58" y="421" font-family="Georgia, 'Segoe UI', serif" font-size="26" fill="#f4efe6" text-anchor="start" font-weight="bold">DAY TWO: TIMED SET</text><text x="58" y="455" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#f4efe6" text-anchor="start">Use your exam's own time per question. Same three</text><text x="58" y="486" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#f4efe6" text-anchor="start">questions, plus:</text><text x="58" y="517" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#f4efe6" text-anchor="start">4  Rushed because of time? PACING</text><text x="58" y="548" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#f4efe6" text-anchor="start">5  Right yesterday, lost today? NERVES</text><line x1="400" y1="577" x2="400" y2="605" stroke="#8a4f1c" stroke-width="5"/><polygon points="388,603 412,603 400,617" fill="#8a4f1c"/><rect x="40" y="629" width="720" height="96" rx="12" fill="#8a4f1c"/><text x="58" y="667" font-family="Georgia, 'Segoe UI', serif" font-size="24" fill="#f4efe6" text-anchor="start">Count the marks in each category. Look for the</text><text x="58" y="700" font-family="Georgia, 'Segoe UI', serif" font-size="24" fill="#f4efe6" text-anchor="start">shape, not precision.</text><rect x="40" y="747" width="350" height="185" rx="12" fill="#ffffff" stroke="#0f2238" stroke-width="3"/><text x="58" y="784" font-family="Georgia, 'Segoe UI', serif" font-size="23" fill="#0f2238" text-anchor="start" font-weight="bold">KNOWLEDGE largest</text><text x="58" y="815" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#0f2238" text-anchor="start">Content first, by</text><text x="58" y="846" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#0f2238" text-anchor="start">retrieval (chapter 15),</text><text x="58" y="877" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#0f2238" text-anchor="start">then the method chapters.</text><rect x="410" y="747" width="350" height="185" rx="12" fill="#ffffff" stroke="#0f2238" stroke-width="3"/><text x="428" y="784" font-family="Georgia, 'Segoe UI', serif" font-size="23" fill="#0f2238" text-anchor="start" font-weight="bold">READING + DECISION</text><text x="428" y="815" font-family="Georgia, 'Segoe UI', serif" font-size="23" fill="#0f2238" text-anchor="start" font-weight="bold">largest together</text><text x="428" y="846" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#0f2238" text-anchor="start">Method first: chapters 6</text><text x="428" y="877" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#0f2238" text-anchor="start">to 9, before more</text><text x="428" y="908" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#0f2238" text-anchor="start">content.</text><rect x="40" y="948" width="350" height="185" rx="12" fill="#ffffff" stroke="#0f2238" stroke-width="3"/><text x="58" y="985" font-family="Georgia, 'Segoe UI', serif" font-size="23" fill="#0f2238" text-anchor="start" font-weight="bold">TIMED score clearly</text><text x="58" y="1016" font-family="Georgia, 'Segoe UI', serif" font-size="23" fill="#0f2238" text-anchor="start" font-weight="bold">lower than untimed</text><text x="58" y="1047" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#0f2238" text-anchor="start">Exam conditions first:</text><text x="58" y="1078" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#0f2238" text-anchor="start">chapters 10 and 11.</text><text x="58" y="1109" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#0f2238" text-anchor="start">Practise timed.</text><rect x="410" y="948" width="350" height="185" rx="12" fill="#ffffff" stroke="#0f2238" stroke-width="3"/><text x="428" y="985" font-family="Georgia, 'Segoe UI', serif" font-size="23" fill="#0f2238" text-anchor="start" font-weight="bold">No clear leader</text><text x="428" y="1016" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#0f2238" text-anchor="start">Start with method:</text><text x="428" y="1047" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#0f2238" text-anchor="start">cheapest to fix, helps</text><text x="428" y="1078" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#0f2238" text-anchor="start">content and nerves.</text></svg>