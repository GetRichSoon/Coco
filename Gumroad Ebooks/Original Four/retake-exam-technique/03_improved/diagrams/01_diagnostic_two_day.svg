<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 980" width="1200" height="980"><rect width="1200" height="980" fill="#f4efe6"/><text x="600.0" y="60" font-family="Georgia, 'Segoe UI', serif" font-size="38" fill="#0f2238" text-anchor="middle" font-weight="bold">Which gap is biggest? The two-day diagnostic</text><rect x="520.0" y="78" width="160" height="5" fill="#b87333"/><rect x="40" y="110" width="540" height="330" rx="14" fill="#0f2238"/><text x="64" y="150" font-family="Georgia, 'Segoe UI', serif" font-size="27" fill="#b87333" text-anchor="start" font-weight="bold">DAY ONE: UNTIMED SET</text><text x="64" y="189" font-family="Georgia, 'Segoe UI', serif" font-size="25" fill="#f4efe6" text-anchor="start" font-weight="normal">For each wrong answer, and each</text><text x="64" y="224" font-family="Georgia, 'Segoe UI', serif" font-size="25" fill="#f4efe6" text-anchor="start" font-weight="normal">right answer marked 'guessing',</text><text x="64" y="259" font-family="Georgia, 'Segoe UI', serif" font-size="25" fill="#f4efe6" text-anchor="start" font-weight="normal">ask in order. Stop at the first yes:</text><text x="64" y="294" font-family="Georgia, 'Segoe UI', serif" font-size="25" fill="#f4efe6" text-anchor="start" font-weight="normal">1  Misread the question?  READING</text><text x="64" y="329" font-family="Georgia, 'Segoe UI', serif" font-size="25" fill="#f4efe6" text-anchor="start" font-weight="normal">2  Did not know the fact?  KNOWLEDGE</text><text x="64" y="364" font-family="Georgia, 'Segoe UI', serif" font-size="25" fill="#f4efe6" text-anchor="start" font-weight="normal">3  Knew it, picked the other</text><text x="64" y="399" font-family="Georgia, 'Segoe UI', serif" font-size="25" fill="#f4efe6" text-anchor="start" font-weight="normal">    plausible option?  DECISION</text><rect x="620" y="110" width="540" height="330" rx="14" fill="#3aa6a0"/><text x="644" y="150" font-family="Georgia, 'Segoe UI', serif" font-size="27" fill="#0f2238" text-anchor="start" font-weight="bold">DAY TWO: TIMED SET</text><text x="644" y="189" font-family="Georgia, 'Segoe UI', serif" font-size="25" fill="#0f2238" text-anchor="start" font-weight="normal">Same three questions, plus:</text><text x="644" y="224" font-family="Georgia, 'Segoe UI', serif" font-size="25" fill="#0f2238" text-anchor="start" font-weight="normal">4  Rushed because of time?</text><text x="644" y="259" font-family="Georgia, 'Segoe UI', serif" font-size="25" fill="#0f2238" text-anchor="start" font-weight="normal">    PACING</text><text x="644" y="294" font-family="Georgia, 'Segoe UI', serif" font-size="25" fill="#0f2238" text-anchor="start" font-weight="normal">5  Right yesterday, lost today?</text><text x="644" y="329" font-family="Georgia, 'Segoe UI', serif" font-size="25" fill="#0f2238" text-anchor="start" font-weight="normal">    NERVES</text><text x="644" y="364" font-family="Georgia, 'Segoe UI', serif" font-size="25" fill="#0f2238" text-anchor="start" font-weight="normal"></text><text x="644" y="399" font-family="Georgia, 'Segoe UI', serif" font-size="25" fill="#0f2238" text-anchor="start" font-weight="normal">Use your exam's time per question.</text><line x1="310" y1="440" x2="310" y2="508" stroke="#b87333" stroke-width="5"/><polygon points="298,506 322,506 310,520" fill="#b87333"/><line x1="890" y1="440" x2="890" y2="508" stroke="#b87333" stroke-width="5"/><polygon points="878,506 902,506 890,520" fill="#b87333"/><rect x="40" y="520" width="1120" height="80" rx="14" fill="#b87333"/><text x="600" y="572" font-family="Georgia, 'Segoe UI', serif" font-size="28" fill="#ffffff" text-anchor="middle" font-weight="bold">Count the marks in each category. Look for the shape, not precision.</text><line x1="600" y1="600" x2="600" y2="638" stroke="#b87333" stroke-width="5"/><polygon points="588,636 612,636 600,650" fill="#b87333"/><rect x="40" y="650" width="260" height="280" rx="14" fill="#ffffff" stroke="#0f2238" stroke-width="3"/><text x="58" y="695" font-family="Georgia, 'Segoe UI', serif" font-size="19" fill="#b87333" text-anchor="start" font-weight="bold">KNOWLEDGE</text><text x="58" y="725" font-family="Georgia, 'Segoe UI', serif" font-size="19" fill="#b87333" text-anchor="start" font-weight="bold">largest</text><text x="58" y="785" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#0f2238" text-anchor="start" font-weight="normal">Content first, by</text><text x="58" y="819" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#0f2238" text-anchor="start" font-weight="normal">retrieval (chapter 15),</text><text x="58" y="853" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#0f2238" text-anchor="start" font-weight="normal">then method chapters</text><rect x="340" y="650" width="260" height="280" rx="14" fill="#ffffff" stroke="#0f2238" stroke-width="3"/><text x="358" y="695" font-family="Georgia, 'Segoe UI', serif" font-size="19" fill="#b87333" text-anchor="start" font-weight="bold">READING + DECISION</text><text x="358" y="725" font-family="Georgia, 'Segoe UI', serif" font-size="19" fill="#b87333" text-anchor="start" font-weight="bold">largest together</text><text x="358" y="785" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#0f2238" text-anchor="start" font-weight="normal">Method first:</text><text x="358" y="819" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#0f2238" text-anchor="start" font-weight="normal">chapters 6 to 9,</text><text x="358" y="853" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#0f2238" text-anchor="start" font-weight="normal">before more content</text><rect x="640" y="650" width="260" height="280" rx="14" fill="#ffffff" stroke="#0f2238" stroke-width="3"/><text x="658" y="695" font-family="Georgia, 'Segoe UI', serif" font-size="19" fill="#b87333" text-anchor="start" font-weight="bold">TIMED score clearly</text><text x="658" y="725" font-family="Georgia, 'Segoe UI', serif" font-size="19" fill="#b87333" text-anchor="start" font-weight="bold">lower than untimed</text><text x="658" y="785" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#0f2238" text-anchor="start" font-weight="normal">Exam conditions first:</text><text x="658" y="819" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#0f2238" text-anchor="start" font-weight="normal">chapters 10 and 11,</text><text x="658" y="853" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#0f2238" text-anchor="start" font-weight="normal">practise timed</text><rect x="940" y="650" width="260" height="280" rx="14" fill="#ffffff" stroke="#0f2238" stroke-width="3"/><text x="958" y="695" font-family="Georgia, 'Segoe UI', serif" font-size="19" fill="#b87333" text-anchor="start" font-weight="bold">No clear leader</text><text x="958" y="725" font-family="Georgia, 'Segoe UI', serif" font-size="19" fill="#b87333" text-anchor="start" font-weight="bold"></text><text x="958" y="785" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#0f2238" text-anchor="start" font-weight="normal">Start with method:</text><text x="958" y="819" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#0f2238" text-anchor="start" font-weight="normal">cheapest to fix, helps</text><text x="958" y="853" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#0f2238" text-anchor="start" font-weight="normal">content and nerves</text></svg>