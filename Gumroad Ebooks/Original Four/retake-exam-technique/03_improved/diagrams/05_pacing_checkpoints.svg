<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760"><rect width="1200" height="760" fill="#f4efe6"/><text x="600.0" y="60" font-family="Georgia, 'Segoe UI', serif" font-size="38" fill="#0f2238" text-anchor="middle" font-weight="bold">Pacing: worked example, 100 questions in 150 minutes</text><rect x="520.0" y="78" width="160" height="5" fill="#b87333"/><text x="600" y="125" font-family="Georgia, 'Segoe UI', serif" font-size="25" fill="#0f2238" text-anchor="middle" font-weight="normal">Keep 10 minutes for review: 140 minutes / 100 questions = 1.4 min = 84 seconds each</text><rect x="80" y="250" width="970.6666666666667" height="70" fill="#3aa6a0"/><rect x="1050.6666666666667" y="250" width="69.33333333333334" height="70" fill="#b87333"/><text x="1085.3333333333335" y="360" font-family="Georgia, 'Segoe UI', serif" font-size="24" fill="#b87333" text-anchor="middle" font-weight="bold">Buffer</text><line x1="80" y1="220" x2="80" y2="320" stroke="#0f2238" stroke-width="4"/><text x="80" y="205" font-family="Georgia, 'Segoe UI', serif" font-size="28" fill="#0f2238" text-anchor="middle" font-weight="bold">Start</text><line x1="322.6666666666667" y1="220" x2="322.6666666666667" y2="320" stroke="#0f2238" stroke-width="4"/><text x="322.6666666666667" y="205" font-family="Georgia, 'Segoe UI', serif" font-size="28" fill="#0f2238" text-anchor="middle" font-weight="bold">Q25</text><text x="322.6666666666667" y="360" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#0f2238" text-anchor="middle" font-weight="normal">35 min used</text><line x1="565.3333333333334" y1="220" x2="565.3333333333334" y2="320" stroke="#0f2238" stroke-width="4"/><text x="565.3333333333334" y="205" font-family="Georgia, 'Segoe UI', serif" font-size="28" fill="#0f2238" text-anchor="middle" font-weight="bold">Q50</text><text x="565.3333333333334" y="360" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#0f2238" text-anchor="middle" font-weight="normal">70 min used</text><line x1="808.0" y1="220" x2="808.0" y2="320" stroke="#0f2238" stroke-width="4"/><text x="808.0" y="205" font-family="Georgia, 'Segoe UI', serif" font-size="28" fill="#0f2238" text-anchor="middle" font-weight="bold">Q75</text><text x="808.0" y="360" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#0f2238" text-anchor="middle" font-weight="normal">105 min used</text><line x1="1050.6666666666667" y1="220" x2="1050.6666666666667" y2="320" stroke="#0f2238" stroke-width="4"/><text x="1050.6666666666667" y="205" font-family="Georgia, 'Segoe UI', serif" font-size="28" fill="#0f2238" text-anchor="middle" font-weight="bold">Q100</text><text x="1050.6666666666667" y="395" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#0f2238" text-anchor="middle" font-weight="normal">140 min used</text><text x="80" y="435" font-family="Georgia, 'Segoe UI', serif" font-size="24" fill="#0f2238" text-anchor="start" font-weight="normal">Teal = answering time, 140 min. Copper = review buffer, 10 min.</text><text x="80" y="475" font-family="Georgia, 'Segoe UI', serif" font-size="24" fill="#0f2238" text-anchor="start" font-weight="normal">Counting down instead? Convert each checkpoint to time remaining: 115, 80, 45, 10 minutes.</text><rect x="40" y="520" width="540" height="190" rx="14" fill="#0f2238"/><text x="64" y="560" font-family="Georgia, 'Segoe UI', serif" font-size="26" fill="#b87333" text-anchor="start" font-weight="bold">THE SKIP RULE</text><text x="64" y="598" font-family="Georgia, 'Segoe UI', serif" font-size="24" fill="#f4efe6" text-anchor="start" font-weight="normal">Hard question has had its time</text><text x="64" y="632" font-family="Georgia, 'Segoe UI', serif" font-size="24" fill="#f4efe6" text-anchor="start" font-weight="normal">(about 84 seconds) and no closer?</text><text x="64" y="666" font-family="Georgia, 'Segoe UI', serif" font-size="24" fill="#f4efe6" text-anchor="start" font-weight="normal">Eliminate, choose best, FLAG, move.</text><rect x="620" y="520" width="540" height="190" rx="14" fill="#3aa6a0"/><text x="644" y="560" font-family="Georgia, 'Segoe UI', serif" font-size="26" fill="#0f2238" text-anchor="start" font-weight="bold">AT EACH CHECKPOINT</text><text x="644" y="598" font-family="Georgia, 'Segoe UI', serif" font-size="24" fill="#0f2238" text-anchor="start" font-weight="normal">On pace or ahead: same method.</text><text x="644" y="632" font-family="Georgia, 'Segoe UI', serif" font-size="24" fill="#0f2238" text-anchor="start" font-weight="normal">Behind: be strict on the hard ones,</text><text x="644" y="666" font-family="Georgia, 'Segoe UI', serif" font-size="24" fill="#0f2238" text-anchor="start" font-weight="normal">not careless on the easy ones.</text></svg>