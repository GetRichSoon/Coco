<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1060" width="1200" height="1060"><rect width="1200" height="1060" fill="#f4efe6"/><text x="600.0" y="60" font-family="Georgia, 'Segoe UI', serif" font-size="38" fill="#0f2238" text-anchor="middle" font-weight="bold">The reading routine: the same six steps on every question</text><rect x="520.0" y="78" width="160" height="5" fill="#b87333"/><rect x="40" y="120" width="1120" height="125" rx="14" fill="#0f2238"/><circle cx="110" cy="182" r="38" fill="#b87333"/><text x="110" y="194" font-family="Georgia, 'Segoe UI', serif" font-size="38" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text><text x="180" y="175" font-family="Georgia, 'Segoe UI', serif" font-size="31" fill="#f4efe6" text-anchor="start" font-weight="bold">Read the lead-in first</text><text x="180" y="218" font-family="Georgia, 'Segoe UI', serif" font-size="25" fill="#d8d2c4" text-anchor="start" font-weight="normal">Know what you are looking for before the story.</text><rect x="40" y="265" width="1120" height="125" rx="14" fill="#0f2238"/><circle cx="110" cy="327" r="38" fill="#b87333"/><text x="110" y="339" font-family="Georgia, 'Segoe UI', serif" font-size="38" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text><text x="180" y="320" font-family="Georgia, 'Segoe UI', serif" font-size="31" fill="#f4efe6" text-anchor="start" font-weight="bold">Find the qualifier, say it</text><text x="180" y="363" font-family="Georgia, 'Segoe UI', serif" font-size="25" fill="#d8d2c4" text-anchor="start" font-weight="normal">FIRST, NEXT, BEST, MOST LIKELY, LEAST, EXCEPT, NOT.</text><rect x="40" y="410" width="1120" height="125" rx="14" fill="#0f2238"/><circle cx="110" cy="472" r="38" fill="#b87333"/><text x="110" y="484" font-family="Georgia, 'Segoe UI', serif" font-size="38" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text><text x="180" y="465" font-family="Georgia, 'Segoe UI', serif" font-size="31" fill="#f4efe6" text-anchor="start" font-weight="bold">Read the stem once, carefully</text><text x="180" y="508" font-family="Georgia, 'Segoe UI', serif" font-size="25" fill="#d8d2c4" text-anchor="start" font-weight="normal">Every fact is evidence: who, what, when, what is done.</text><rect x="40" y="555" width="1120" height="125" rx="14" fill="#0f2238"/><circle cx="110" cy="617" r="38" fill="#b87333"/><text x="110" y="629" font-family="Georgia, 'Segoe UI', serif" font-size="38" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text><text x="180" y="610" font-family="Georgia, 'Segoe UI', serif" font-size="31" fill="#f4efe6" text-anchor="start" font-weight="bold">Predict an answer in your own words</text><text x="180" y="653" font-family="Georgia, 'Segoe UI', serif" font-size="25" fill="#d8d2c4" text-anchor="start" font-weight="normal">Before you look at the options. Rough is fine.</text><rect x="40" y="700" width="1120" height="125" rx="14" fill="#0f2238"/><circle cx="110" cy="762" r="38" fill="#b87333"/><text x="110" y="774" font-family="Georgia, 'Segoe UI', serif" font-size="38" fill="#ffffff" text-anchor="middle" font-weight="bold">5</text><text x="180" y="755" font-family="Georgia, 'Segoe UI', serif" font-size="31" fill="#f4efe6" text-anchor="start" font-weight="bold">Read every option, all the way</text><text x="180" y="798" font-family="Georgia, 'Segoe UI', serif" font-size="25" fill="#d8d2c4" text-anchor="start" font-weight="normal">Even if the first one looks right.</text><rect x="40" y="845" width="1120" height="125" rx="14" fill="#0f2238"/><circle cx="110" cy="907" r="38" fill="#b87333"/><text x="110" y="919" font-family="Georgia, 'Segoe UI', serif" font-size="38" fill="#ffffff" text-anchor="middle" font-weight="bold">6</text><text x="180" y="900" font-family="Georgia, 'Segoe UI', serif" font-size="31" fill="#f4efe6" text-anchor="start" font-weight="bold">Choose the match</text><text x="180" y="943" font-family="Georgia, 'Segoe UI', serif" font-size="25" fill="#d8d2c4" text-anchor="start" font-weight="normal">The option that fits your prediction and answers the lead-in.</text><text x="600" y="1015" font-family="Georgia, 'Segoe UI', serif" font-size="25" fill="#b87333" text-anchor="middle" font-weight="bold">Step 4 does the most work: predict first, so the distractors cannot do your thinking.</text></svg>