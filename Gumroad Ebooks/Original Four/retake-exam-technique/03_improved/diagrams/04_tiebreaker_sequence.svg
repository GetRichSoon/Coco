<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1100" width="1200" height="1100"><rect width="1200" height="1100" fill="#f4efe6"/><text x="600.0" y="60" font-family="Georgia, 'Segoe UI', serif" font-size="38" fill="#0f2238" text-anchor="middle" font-weight="bold">Two options left: the tie-breaker sequence</text><rect x="520.0" y="78" width="160" height="5" fill="#b87333"/><rect x="40" y="115" width="1120" height="92" rx="14" fill="#0f2238"/><circle cx="100" cy="161" r="30" fill="#3aa6a0"/><text x="100" y="172" font-family="Georgia, 'Segoe UI', serif" font-size="32" fill="#0f2238" text-anchor="middle" font-weight="bold">1</text><text x="160" y="172" font-family="Georgia, 'Segoe UI', serif" font-size="26" fill="#f4efe6" text-anchor="start" font-weight="normal">What exactly is this asking?  (say the lead-in in your own words)</text><rect x="40" y="227" width="1120" height="92" rx="14" fill="#0f2238"/><circle cx="100" cy="273" r="30" fill="#3aa6a0"/><text x="100" y="284" font-family="Georgia, 'Segoe UI', serif" font-size="32" fill="#0f2238" text-anchor="middle" font-weight="bold">2</text><text x="160" y="284" font-family="Georgia, 'Segoe UI', serif" font-size="26" fill="#f4efe6" text-anchor="start" font-weight="normal">What is the qualifier, and what does its rule say?</text><rect x="40" y="339" width="1120" height="92" rx="14" fill="#0f2238"/><circle cx="100" cy="385" r="30" fill="#3aa6a0"/><text x="100" y="396" font-family="Georgia, 'Segoe UI', serif" font-size="32" fill="#0f2238" text-anchor="middle" font-weight="bold">3</text><text x="160" y="396" font-family="Georgia, 'Segoe UI', serif" font-size="26" fill="#f4efe6" text-anchor="start" font-weight="normal">Which option uses every fact in the stem?</text><rect x="40" y="451" width="1120" height="92" rx="14" fill="#0f2238"/><circle cx="100" cy="497" r="30" fill="#3aa6a0"/><text x="100" y="508" font-family="Georgia, 'Segoe UI', serif" font-size="32" fill="#0f2238" text-anchor="middle" font-weight="bold">4</text><text x="160" y="508" font-family="Georgia, 'Segoe UI', serif" font-size="26" fill="#f4efe6" text-anchor="start" font-weight="normal">Is one of these inside the other?</text><rect x="40" y="563" width="1120" height="92" rx="14" fill="#0f2238"/><circle cx="100" cy="609" r="30" fill="#3aa6a0"/><text x="100" y="620" font-family="Georgia, 'Segoe UI', serif" font-size="32" fill="#0f2238" text-anchor="middle" font-weight="bold">5</text><text x="160" y="620" font-family="Georgia, 'Segoe UI', serif" font-size="26" fill="#f4efe6" text-anchor="start" font-weight="normal">Does either need an assumption the stem does not give?</text><rect x="40" y="675" width="1120" height="92" rx="14" fill="#0f2238"/><circle cx="100" cy="721" r="30" fill="#3aa6a0"/><text x="100" y="732" font-family="Georgia, 'Segoe UI', serif" font-size="32" fill="#0f2238" text-anchor="middle" font-weight="bold">6</text><text x="160" y="732" font-family="Georgia, 'Segoe UI', serif" font-size="26" fill="#f4efe6" text-anchor="start" font-weight="normal">Is either extreme, where the situation calls for judgement?</text><rect x="40" y="787" width="1120" height="92" rx="14" fill="#0f2238"/><circle cx="100" cy="833" r="30" fill="#3aa6a0"/><text x="100" y="844" font-family="Georgia, 'Segoe UI', serif" font-size="32" fill="#0f2238" text-anchor="middle" font-weight="bold">7</text><text x="160" y="844" font-family="Georgia, 'Segoe UI', serif" font-size="26" fill="#f4efe6" text-anchor="start" font-weight="normal">Can I defend each in one sentence, using only the stem?</text><rect x="40" y="899" width="1120" height="92" rx="14" fill="#b87333"/><circle cx="100" cy="945" r="30" fill="#0f2238"/><text x="100" y="956" font-family="Georgia, 'Segoe UI', serif" font-size="32" fill="#ffffff" text-anchor="middle" font-weight="bold">8</text><text x="160" y="956" font-family="Georgia, 'Segoe UI', serif" font-size="26" fill="#ffffff" text-anchor="start" font-weight="normal">Choose, flag, move.</text><text x="600" y="1021" font-family="Georgia, 'Segoe UI', serif" font-size="26" fill="#b87333" text-anchor="middle" font-weight="bold">Stop at the first step that separates the two. If none does, step 8.</text></svg>