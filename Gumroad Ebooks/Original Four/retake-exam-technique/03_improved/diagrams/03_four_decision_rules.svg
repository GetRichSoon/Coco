<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1075" width="1200" height="1075"><rect width="1200" height="1075" fill="#f4efe6"/><text x="600.0" y="60" font-family="Georgia, 'Segoe UI', serif" font-size="38" fill="#0f2238" text-anchor="middle" font-weight="bold">One rule per qualifier</text><rect x="520.0" y="78" width="160" height="5" fill="#b87333"/><rect x="40" y="110" width="550" height="440" rx="14" fill="#0f2238"/><rect x="40" y="110" width="550" height="70" rx="14" fill="#b87333"/><text x="64" y="159" font-family="Georgia, 'Segoe UI', serif" font-size="36" fill="#ffffff" text-anchor="start" font-weight="bold">FIRST</text><text x="64" y="225" font-family="Georgia, 'Segoe UI', serif" font-size="23" fill="#f4efe6" text-anchor="start" font-weight="normal">Danger in the stem? Remove it.</text><text x="64" y="265" font-family="Georgia, 'Segoe UI', serif" font-size="23" fill="#f4efe6" text-anchor="start" font-weight="normal">No danger? Gather information</text><text x="64" y="305" font-family="Georgia, 'Segoe UI', serif" font-size="23" fill="#f4efe6" text-anchor="start" font-weight="normal">before anything you cannot undo.</text><text x="64" y="345" font-family="Georgia, 'Segoe UI', serif" font-size="23" fill="#8fd6d1" text-anchor="start" font-weight="normal">Skip it: do the others become unsafe,</text><text x="64" y="385" font-family="Georgia, 'Segoe UI', serif" font-size="23" fill="#8fd6d1" text-anchor="start" font-weight="normal">pointless or impossible?</text><text x="64" y="425" font-family="Georgia, 'Segoe UI', serif" font-size="23" fill="#f0b27a" text-anchor="start" font-weight="normal">Trap: most important, not earliest.</text><rect x="610" y="110" width="550" height="440" rx="14" fill="#0f2238"/><rect x="610" y="110" width="550" height="70" rx="14" fill="#b87333"/><text x="634" y="159" font-family="Georgia, 'Segoe UI', serif" font-size="36" fill="#ffffff" text-anchor="start" font-weight="bold">NEXT</text><text x="634" y="225" font-family="Georgia, 'Segoe UI', serif" font-size="23" fill="#f4efe6" text-anchor="start" font-weight="normal">Where are you in the sequence?</text><text x="634" y="265" font-family="Georgia, 'Segoe UI', serif" font-size="23" fill="#f4efe6" text-anchor="start" font-weight="normal">The very next step: not the first</text><text x="634" y="305" font-family="Georgia, 'Segoe UI', serif" font-size="23" fill="#f4efe6" text-anchor="start" font-weight="normal">again, not two steps on.</text><text x="634" y="345" font-family="Georgia, 'Segoe UI', serif" font-size="23" fill="#8fd6d1" text-anchor="start" font-weight="normal">Ask: what has already happened?</text><text x="634" y="385" font-family="Georgia, 'Segoe UI', serif" font-size="23" fill="#f4efe6" text-anchor="start" font-weight="normal"></text><text x="634" y="425" font-family="Georgia, 'Segoe UI', serif" font-size="23" fill="#f0b27a" text-anchor="start" font-weight="normal">Trap: the satisfying later step.</text><rect x="40" y="580" width="550" height="440" rx="14" fill="#0f2238"/><rect x="40" y="580" width="550" height="70" rx="14" fill="#b87333"/><text x="64" y="629" font-family="Georgia, 'Segoe UI', serif" font-size="36" fill="#ffffff" text-anchor="start" font-weight="bold">BEST</text><text x="64" y="695" font-family="Georgia, 'Segoe UI', serif" font-size="23" fill="#f4efe6" text-anchor="start" font-weight="normal">Several options are acceptable.</text><text x="64" y="735" font-family="Georgia, 'Segoe UI', serif" font-size="23" fill="#f4efe6" text-anchor="start" font-weight="normal">The best meets every goal and</text><text x="64" y="775" font-family="Georgia, 'Segoe UI', serif" font-size="23" fill="#f4efe6" text-anchor="start" font-weight="normal">every limit the stem states.</text><text x="64" y="815" font-family="Georgia, 'Segoe UI', serif" font-size="23" fill="#8fd6d1" text-anchor="start" font-weight="normal">Ask: which option meets all of them?</text><text x="64" y="855" font-family="Georgia, 'Segoe UI', serif" font-size="23" fill="#f4efe6" text-anchor="start" font-weight="normal"></text><text x="64" y="895" font-family="Georgia, 'Segoe UI', serif" font-size="23" fill="#f0b27a" text-anchor="start" font-weight="normal">Trap: great on one goal, ignores one.</text><rect x="610" y="580" width="550" height="440" rx="14" fill="#0f2238"/><rect x="610" y="580" width="550" height="70" rx="14" fill="#b87333"/><text x="634" y="629" font-family="Georgia, 'Segoe UI', serif" font-size="36" fill="#ffffff" text-anchor="start" font-weight="bold">MOST LIKELY</text><text x="634" y="695" font-family="Georgia, 'Segoe UI', serif" font-size="23" fill="#f4efe6" text-anchor="start" font-weight="normal">Fits every fact in the stem.</text><text x="634" y="735" font-family="Georgia, 'Segoe UI', serif" font-size="23" fill="#f4efe6" text-anchor="start" font-weight="normal">The common cause, not the rare</text><text x="634" y="775" font-family="Georgia, 'Segoe UI', serif" font-size="23" fill="#f4efe6" text-anchor="start" font-weight="normal">or dramatic one.</text><text x="634" y="815" font-family="Georgia, 'Segoe UI', serif" font-size="23" fill="#8fd6d1" text-anchor="start" font-weight="normal">Ask: which fits without facts I add?</text><text x="634" y="855" font-family="Georgia, 'Segoe UI', serif" font-size="23" fill="#f4efe6" text-anchor="start" font-weight="normal"></text><text x="634" y="895" font-family="Georgia, 'Segoe UI', serif" font-size="23" fill="#f0b27a" text-anchor="start" font-weight="normal">Trap: the striking, memorable answer.</text><text x="600" y="1055" font-family="Georgia, 'Segoe UI', serif" font-size="22" fill="#0f2238" text-anchor="middle" font-weight="bold">LEAST, EXCEPT, NOT: sort each option into 'fits' or 'does not fit'. The odd one out is the answer.</text></svg>