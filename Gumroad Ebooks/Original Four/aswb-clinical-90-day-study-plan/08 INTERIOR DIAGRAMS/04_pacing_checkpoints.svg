<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 834" width="800" height="834" font-family="Georgia, Segoe UI, serif"><title>Pacing checkpoints in each two-hour section</title>
<rect width="800" height="834" fill="#f4efe6"/>
<text x="400.0" y="40.0" text-anchor="middle" font-size="30" font-weight="bold" fill="#0f2238">Pacing checkpoints in each section</text>
<text x="400.0" y="76.0" text-anchor="middle" font-size="22" font-weight="normal" fill="#0f2238">Each section: 61 questions, 120 minutes. Working target</text>
<text x="400.0" y="105.0" text-anchor="middle" font-size="22" font-weight="normal" fill="#0f2238">105 minutes, reserve 15.</text>
<text x="30.0" y="136.0" text-anchor="start" font-size="24" font-weight="bold" fill="#0f2238">Section one</text>
<rect x="30.0" y="150.0" width="647.5" height="46.0" rx="0" fill="#3aa6a0" stroke="#0f2238" stroke-width="2"/>
<rect x="677.5" y="150.0" width="92.5" height="46.0" rx="0" fill="#b87333" stroke="#0f2238" stroke-width="2"/>
<line x1="30.0" y1="146.0" x2="30.0" y2="216.0" stroke="#0f2238" stroke-width="3"/>
<text x="30.0" y="246.0" text-anchor="start" font-size="22" font-weight="bold" fill="#0f2238">0 min</text>
<text x="30.0" y="274.0" text-anchor="start" font-size="22" font-weight="normal" fill="#0f2238">Start</text>
<line x1="245.8" y1="146.0" x2="245.8" y2="216.0" stroke="#0f2238" stroke-width="3"/>
<text x="245.8" y="246.0" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f2238">35 min</text>
<text x="245.8" y="274.0" text-anchor="middle" font-size="22" font-weight="normal" fill="#0f2238">Q20</text>
<line x1="455.5" y1="146.0" x2="455.5" y2="216.0" stroke="#0f2238" stroke-width="3"/>
<text x="455.5" y="246.0" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f2238">69 min</text>
<text x="455.5" y="274.0" text-anchor="middle" font-size="22" font-weight="normal" fill="#0f2238">Q40</text>
<line x1="677.5" y1="146.0" x2="677.5" y2="216.0" stroke="#0f2238" stroke-width="3"/>
<text x="677.5" y="246.0" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f2238">105 min</text>
<text x="677.5" y="274.0" text-anchor="middle" font-size="22" font-weight="normal" fill="#0f2238">Q61</text>
<rect x="30.0" y="305.0" width="740.0" height="76.0" rx="8" fill="#ffffff" stroke="#0f2238" stroke-width="2"/>
<text x="400.0" y="338.0" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f2238">Optional break: up to 10 minutes</text>
<text x="400.0" y="366.0" text-anchor="middle" font-size="22" font-weight="normal" fill="#0f2238">The exam clock stops. Not counted below.</text>
<text x="30.0" y="436.0" text-anchor="start" font-size="24" font-weight="bold" fill="#0f2238">Section two</text>
<rect x="30.0" y="450.0" width="647.5" height="46.0" rx="0" fill="#3aa6a0" stroke="#0f2238" stroke-width="2"/>
<rect x="677.5" y="450.0" width="92.5" height="46.0" rx="0" fill="#b87333" stroke="#0f2238" stroke-width="2"/>
<line x1="30.0" y1="446.0" x2="30.0" y2="516.0" stroke="#0f2238" stroke-width="3"/>
<text x="30.0" y="546.0" text-anchor="start" font-size="22" font-weight="bold" fill="#0f2238">0 min</text>
<text x="30.0" y="574.0" text-anchor="start" font-size="22" font-weight="normal" fill="#0f2238">Start</text>
<line x1="245.8" y1="446.0" x2="245.8" y2="516.0" stroke="#0f2238" stroke-width="3"/>
<text x="245.8" y="546.0" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f2238">35 min</text>
<text x="245.8" y="574.0" text-anchor="middle" font-size="22" font-weight="normal" fill="#0f2238">Q20</text>
<line x1="455.5" y1="446.0" x2="455.5" y2="516.0" stroke="#0f2238" stroke-width="3"/>
<text x="455.5" y="546.0" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f2238">69 min</text>
<text x="455.5" y="574.0" text-anchor="middle" font-size="22" font-weight="normal" fill="#0f2238">Q40</text>
<line x1="677.5" y1="446.0" x2="677.5" y2="516.0" stroke="#0f2238" stroke-width="3"/>
<text x="677.5" y="546.0" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f2238">105 min</text>
<text x="677.5" y="574.0" text-anchor="middle" font-size="22" font-weight="normal" fill="#0f2238">Q61</text>
<text x="30.0" y="620.0" text-anchor="start" font-size="22" font-weight="normal" fill="#0f2238">Teal = working time. Copper = 15 minute reserve in each</text>
<text x="30.0" y="649.0" text-anchor="start" font-size="22" font-weight="normal" fill="#0f2238">section (30 in all); it does not carry over from section one.</text>
<text x="30.0" y="688.0" text-anchor="start" font-size="22" font-weight="normal" fill="#0f2238">Cumulative exam clock: Q61 at 105, Q81 at 140, Q101 at 174,</text>
<text x="30.0" y="717.0" text-anchor="start" font-size="22" font-weight="normal" fill="#0f2238">Q122 at 210 minutes.</text>
<text x="30.0" y="756.0" text-anchor="start" font-size="22" font-weight="bold" fill="#0f2238">If you check only once, check at question 40 of a section:</text>
<text x="30.0" y="785.0" text-anchor="start" font-size="22" font-weight="bold" fill="#0f2238">about 69 minutes.</text>
</svg>
