<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="Georgia, Segoe UI, serif"><title>When you are behind: what to cut and what never to cut</title>
<rect width="1200" height="760" fill="#f4efe6"/>
<text x="600.0" y="46.0" text-anchor="middle" font-size="34" font-weight="bold" fill="#0f2238">Are you behind? Decide in advance</text>
<rect x="250.0" y="70.0" width="700.0" height="100.0" rx="10" fill="#0f2238" stroke="#0f2238" stroke-width="2"/>
<text x="600.0" y="100.0" text-anchor="middle" font-size="21" font-weight="bold" fill="#f4efe6">Two questions</text>
<text x="600.0" y="127.3" text-anchor="middle" font-size="21" font-weight="normal" fill="#f4efe6">1. More than 3 study blocks missed in the last fortnight?</text>
<text x="600.0" y="154.7" text-anchor="middle" font-size="21" font-weight="normal" fill="#f4efe6">2. Review accuracy flat or falling in 2 or more areas?</text>
<line x1="600" y1="170" x2="600" y2="195" stroke="#0f2238" stroke-width="3"/>
<line x1="170" y1="195" x2="1030" y2="195" stroke="#0f2238" stroke-width="3"/>
<line x1="170" y1="195" x2="170" y2="225" stroke="#0f2238" stroke-width="3"/>
<line x1="600" y1="195" x2="600" y2="225" stroke="#0f2238" stroke-width="3"/>
<line x1="1030" y1="195" x2="1030" y2="225" stroke="#0f2238" stroke-width="3"/>
<rect x="40.0" y="225.0" width="260.0" height="110.0" rx="10" fill="#ffffff" stroke="#0f2238" stroke-width="2"/>
<text x="170.0" y="261.0" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f2238">Neither</text>
<text x="170.0" y="287.0" text-anchor="middle" font-size="20" font-weight="normal" fill="#0f2238">Not behind. The absorbing</text>
<text x="170.0" y="313.0" text-anchor="middle" font-size="20" font-weight="normal" fill="#0f2238">slot handles it. Carry on.</text>
<rect x="470.0" y="225.0" width="260.0" height="110.0" rx="10" fill="#ffffff" stroke="#0f2238" stroke-width="2"/>
<text x="600.0" y="261.0" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f2238">One</text>
<text x="600.0" y="287.0" text-anchor="middle" font-size="20" font-weight="normal" fill="#0f2238">Use the absorbing slot,</text>
<text x="600.0" y="313.0" text-anchor="middle" font-size="20" font-weight="normal" fill="#0f2238">then the triage order below</text>
<rect x="900.0" y="225.0" width="260.0" height="110.0" rx="10" fill="#ffffff" stroke="#0f2238" stroke-width="2"/>
<text x="1030.0" y="261.0" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f2238">Both</text>
<text x="1030.0" y="287.0" text-anchor="middle" font-size="20" font-weight="normal" fill="#0f2238">Run the compressed plan</text>
<text x="1030.0" y="313.0" text-anchor="middle" font-size="20" font-weight="normal" fill="#0f2238">(lost 2 weeks or more)</text>
<text x="600.0" y="385.0" text-anchor="middle" font-size="26" font-weight="bold" fill="#0f2238">Triage order when time is short</text>
<rect x="40.0" y="405.0" width="360.0" height="80.0" rx="10" fill="#b87333" stroke="#0f2238" stroke-width="2"/>
<text x="220.0" y="438.7" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f2238">Cut 1st</text>
<text x="220.0" y="466.0" text-anchor="middle" font-size="21" font-weight="normal" fill="#0f2238">New rated-3 statements</text>
<rect x="420.0" y="405.0" width="360.0" height="80.0" rx="10" fill="#b87333" stroke="#0f2238" stroke-width="2"/>
<text x="600.0" y="438.7" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f2238">Cut 2nd</text>
<text x="600.0" y="466.0" text-anchor="middle" font-size="21" font-weight="normal" fill="#0f2238">Rated-2 breadth, strongest area</text>
<rect x="800.0" y="405.0" width="360.0" height="80.0" rx="10" fill="#b87333" stroke="#0f2238" stroke-width="2"/>
<text x="980.0" y="439.0" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f2238">Cut 3rd</text>
<text x="980.0" y="465.0" text-anchor="middle" font-size="20" font-weight="normal" fill="#0f2238">1 block a week (20% floor)</text>
<text x="600.0" y="530.0" text-anchor="middle" font-size="26" font-weight="bold" fill="#0f2238">Never cut</text>
<rect x="40.0" y="550.0" width="360.0" height="70.0" rx="10" fill="#3aa6a0" stroke="#0f2238" stroke-width="2"/>
<text x="220.0" y="593.4" text-anchor="middle" font-size="24" font-weight="bold" fill="#0f2238">The review day</text>
<rect x="420.0" y="550.0" width="360.0" height="70.0" rx="10" fill="#3aa6a0" stroke="#0f2238" stroke-width="2"/>
<text x="600.0" y="593.4" text-anchor="middle" font-size="24" font-weight="bold" fill="#0f2238">Phase 3 pacing sessions</text>
<rect x="800.0" y="550.0" width="360.0" height="70.0" rx="10" fill="#3aa6a0" stroke="#0f2238" stroke-width="2"/>
<text x="980.0" y="593.4" text-anchor="middle" font-size="24" font-weight="bold" fill="#0f2238">The off day</text>
<text x="600.0" y="675.0" text-anchor="middle" font-size="21" font-weight="normal" fill="#0f2238">Compressed plan: phase 2 shrinks to 6 weeks (rated-1 statements only). Phases 3 and 4 stay unchanged.</text>
<text x="600.0" y="710.0" text-anchor="middle" font-size="21" font-weight="normal" fill="#0f2238">More than 4 weeks lost: decide at the end of week 8 whether to sit on day 90 at all.</text>
</svg>