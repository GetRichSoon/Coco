<text x="600.0" y="380.0" text-anchor="middle" font-size="26" font-weight="bold" fill="#0f2238">If you check only once, check at the end of section one: about 105 minutes.</text>
<text x="600.0" y="418.0" text-anchor="middle" font-size="22" font-weight="normal" fill="#0f2238">At 130 minutes you have a problem you can still fix. At question 110 you cannot.</text>
