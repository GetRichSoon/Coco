<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 962" width="1200" height="962" role="img" aria-label="How a profit of 3,675 became a bank increase of 875"><rect width="1200" height="962" fill="#f4efe6"/><g font-family="Georgia, 'Segoe UI', serif" fill="#0f2238"><text x="600" y="58" text-anchor="middle" font-size="38" font-weight="bold" fill="#0f2238">Profit is not cash: June in the worked month</text><text x="40" y="127" text-anchor="start" font-size="32" font-weight="bold" fill="#0f2238">Profit for June</text><rect x="40.0" y="141" width="800.0" height="46" rx="6" fill="#0f2238"/><text x="854.0" y="177" text-anchor="start" font-size="32" font-weight="bold" fill="#0f2238">+3,675</text><text x="40" y="239" text-anchor="start" font-size="32" font-weight="normal" fill="#0f2238">Receivables rose (1,500 to 3,000): earned, not yet collected</text><rect x="513.5" y="253" width="326.5" height="46" rx="6" fill="#b87333"/><text x="854.0" y="289" text-anchor="start" font-size="32" font-weight="bold" fill="#0f2238">-1,500</text><text x="40" y="351" text-anchor="start" font-size="32" font-weight="normal" fill="#0f2238">Deposit of 600 now earned: income, but cash came in May</text><rect x="382.9" y="365" width="130.6" height="46" rx="6" fill="#b87333"/><text x="527.5" y="401" text-anchor="start" font-size="32" font-weight="bold" fill="#0f2238">-600</text><text x="40" y="463" text-anchor="start" font-size="32" font-weight="normal" fill="#0f2238">Payables rose (300 to 800): a cost incurred, not yet paid</text><rect x="382.9" y="477" width="108.8" height="46" rx="6" fill="#3aa6a0"/><text x="505.7" y="513" text-anchor="start" font-size="32" font-weight="bold" fill="#0f2238">+500</text><text x="40" y="575" text-anchor="start" font-size="32" font-weight="normal" fill="#0f2238">Drawings: you took money for yourself</text><rect x="230.5" y="589" width="261.2" height="46" rx="6" fill="#b87333"/><text x="505.7" y="625" text-anchor="start" font-size="32" font-weight="bold" fill="#0f2238">-1,200</text><text x="40" y="687" text-anchor="start" font-size="32" font-weight="bold" fill="#0f2238">Bank balance rose by</text><rect x="40.0" y="701" width="190.5" height="46" rx="6" fill="#0f2238"/><text x="244.5" y="737" text-anchor="start" font-size="32" font-weight="bold" fill="#0f2238">+875</text><text x="600" y="817" text-anchor="middle" font-size="36" font-weight="bold" fill="#0f2238">3,675 - 1,500 - 600 + 500 - 1,200 = 875</text><text x="600" y="872" text-anchor="middle" font-size="32" font-weight="normal" fill="#0f2238">Both figures are right. Reading both statements</text><text x="600" y="914" text-anchor="middle" font-size="32" font-weight="normal" fill="#0f2238">shows where the gap went.</text></g></svg>