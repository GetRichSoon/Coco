<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 810" width="1200" height="810" role="img" aria-label="How a profit of 3,675 became a bank increase of 875"><rect width="1200" height="810" fill="#f4efe6"/><g font-family="Georgia, 'Segoe UI', serif" fill="#0f2238"><text x="600" y="55" text-anchor="middle" font-size="38" font-weight="bold" fill="#0f2238">Profit is not cash: June in the worked month</text><text x="40" y="110" text-anchor="start" font-size="25" font-weight="bold" fill="#0f2238">Profit for June</text><rect x="40.0" y="122" width="800.0" height="44" rx="6" fill="#0f2238"/><text x="854.0" y="156" text-anchor="start" font-size="28" font-weight="bold" fill="#0f2238">+3,675</text><text x="40" y="210" text-anchor="start" font-size="25" font-weight="normal" fill="#0f2238">Receivables rose (1,500 to 3,000): earned, not collected</text><rect x="513.469387755102" y="222" width="326.53061224489795" height="44" rx="6" fill="#b87333"/><text x="854.0" y="256" text-anchor="start" font-size="28" font-weight="bold" fill="#0f2238">-1,500</text><text x="40" y="310" text-anchor="start" font-size="25" font-weight="normal" fill="#0f2238">Deposit of 600 now earned: income, but cash came in May</text><rect x="382.85714285714283" y="322" width="130.6122448979592" height="44" rx="6" fill="#b87333"/><text x="527.469387755102" y="356" text-anchor="start" font-size="28" font-weight="bold" fill="#0f2238">-600</text><text x="40" y="410" text-anchor="start" font-size="25" font-weight="normal" fill="#0f2238">Payables rose (300 to 800): a cost incurred, not yet paid</text><rect x="382.85714285714283" y="422" width="108.84353741496598" height="44" rx="6" fill="#3aa6a0"/><text x="505.7006802721088" y="456" text-anchor="start" font-size="28" font-weight="bold" fill="#0f2238">+500</text><text x="40" y="510" text-anchor="start" font-size="25" font-weight="normal" fill="#0f2238">Drawings: you took money for yourself</text><rect x="230.47619047619048" y="522" width="261.2244897959184" height="44" rx="6" fill="#b87333"/><text x="505.70068027210885" y="556" text-anchor="start" font-size="28" font-weight="bold" fill="#0f2238">-1,200</text><text x="40" y="610" text-anchor="start" font-size="25" font-weight="bold" fill="#0f2238">Bank balance rose by</text><rect x="40.0" y="622" width="190.47619047619048" height="44" rx="6" fill="#0f2238"/><text x="244.47619047619048" y="656" text-anchor="start" font-size="28" font-weight="bold" fill="#0f2238">+875</text><text x="600" y="730" text-anchor="middle" font-size="30" font-weight="bold" fill="#0f2238">3,675 - 1,500 - 600 + 500 - 1,200 = 875</text><text x="600" y="772" text-anchor="middle" font-size="25" font-weight="normal" fill="#0f2238">Both figures are right. Reading both statements shows where the gap went.</text></g></svg>