<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 822" width="1200" height="822" role="img" aria-label="The seven step month end close with minutes"><rect width="1200" height="822" fill="#f4efe6"/><g font-family="Georgia, 'Segoe UI', serif" fill="#0f2238"><text x="600" y="55" text-anchor="middle" font-size="38" font-weight="bold" fill="#0f2238">The month-end close: one hour, seven steps</text><circle cx="75" cy="130" r="32" fill="#b87333"/><text x="75" y="141" text-anchor="middle" font-size="32" font-weight="bold" fill="#0f2238">1</text><rect x="130" y="90" width="830" height="80" rx="14" fill="#0f2238"/><text x="154" y="122.5" text-anchor="start" font-size="25" font-weight="bold" fill="#f4efe6">Record everything outstanding</text><text x="154" y="155.0" text-anchor="start" font-size="25" font-weight="normal" fill="#f4efe6">Every invoice, bill and receipt</text><rect x="990" y="90" width="170" height="80" rx="14" fill="#3aa6a0"/><text x="1075.0" y="140.5" text-anchor="middle" font-size="30" font-weight="bold" fill="#0f2238">15 min</text><circle cx="75" cy="226" r="32" fill="#b87333"/><text x="75" y="237" text-anchor="middle" font-size="32" font-weight="bold" fill="#0f2238">2</text><rect x="130" y="186" width="830" height="80" rx="14" fill="#0f2238"/><text x="154" y="218.5" text-anchor="start" font-size="25" font-weight="bold" fill="#f4efe6">Reconcile every account</text><text x="154" y="251.0" text-anchor="start" font-size="25" font-weight="normal" fill="#f4efe6">If it will not balance, stop and find it</text><rect x="990" y="186" width="170" height="80" rx="14" fill="#3aa6a0"/><text x="1075.0" y="236.5" text-anchor="middle" font-size="30" font-weight="bold" fill="#0f2238">20 min</text><circle cx="75" cy="322" r="32" fill="#b87333"/><text x="75" y="333" text-anchor="middle" font-size="32" font-weight="bold" fill="#0f2238">3</text><rect x="130" y="282" width="830" height="80" rx="14" fill="#0f2238"/><text x="154" y="314.5" text-anchor="start" font-size="25" font-weight="bold" fill="#f4efe6">Check the trial balance</text><text x="154" y="347.0" text-anchor="start" font-size="25" font-weight="normal" fill="#f4efe6">Debits equal credits</text><rect x="990" y="282" width="170" height="80" rx="14" fill="#3aa6a0"/><text x="1075.0" y="332.5" text-anchor="middle" font-size="30" font-weight="bold" fill="#0f2238">2 min</text><circle cx="75" cy="418" r="32" fill="#b87333"/><text x="75" y="429" text-anchor="middle" font-size="32" font-weight="bold" fill="#0f2238">4</text><rect x="130" y="378" width="830" height="80" rx="14" fill="#0f2238"/><text x="154" y="410.5" text-anchor="start" font-size="25" font-weight="bold" fill="#f4efe6">Review four accounts</text><text x="154" y="443.0" text-anchor="start" font-size="25" font-weight="normal" fill="#f4efe6">Other expenses, Unidentified receipts, Unearned income, Drawings</text><rect x="990" y="378" width="170" height="80" rx="14" fill="#3aa6a0"/><text x="1075.0" y="428.5" text-anchor="middle" font-size="30" font-weight="bold" fill="#0f2238">10 min</text><circle cx="75" cy="514" r="32" fill="#b87333"/><text x="75" y="525" text-anchor="middle" font-size="32" font-weight="bold" fill="#0f2238">5</text><rect x="130" y="474" width="830" height="80" rx="14" fill="#0f2238"/><text x="154" y="506.5" text-anchor="start" font-size="25" font-weight="bold" fill="#f4efe6">Read the aged receivables</text><text x="154" y="539.0" text-anchor="start" font-size="25" font-weight="normal" fill="#f4efe6">Anything over 60 days needs action today</text><rect x="990" y="474" width="170" height="80" rx="14" fill="#3aa6a0"/><text x="1075.0" y="524.5" text-anchor="middle" font-size="30" font-weight="bold" fill="#0f2238">5 min</text><circle cx="75" cy="610" r="32" fill="#b87333"/><text x="75" y="621" text-anchor="middle" font-size="32" font-weight="bold" fill="#0f2238">6</text><rect x="130" y="570" width="830" height="80" rx="14" fill="#0f2238"/><text x="154" y="602.5" text-anchor="start" font-size="25" font-weight="bold" fill="#f4efe6">Read the two statements</text><text x="154" y="635.0" text-anchor="start" font-size="25" font-weight="normal" fill="#f4efe6">Profit and loss, balance sheet</text><rect x="990" y="570" width="170" height="80" rx="14" fill="#3aa6a0"/><text x="1075.0" y="620.5" text-anchor="middle" font-size="30" font-weight="bold" fill="#0f2238">5 min</text><circle cx="75" cy="706" r="32" fill="#b87333"/><text x="75" y="717" text-anchor="middle" font-size="32" font-weight="bold" fill="#0f2238">7</text><rect x="130" y="666" width="830" height="80" rx="14" fill="#0f2238"/><text x="154" y="698.5" text-anchor="start" font-size="25" font-weight="bold" fill="#f4efe6">Close and record it</text><text x="154" y="731.0" text-anchor="start" font-size="25" font-weight="normal" fill="#f4efe6">Mark closed with the date, note judgements</text><rect x="990" y="666" width="170" height="80" rx="14" fill="#3aa6a0"/><text x="1075.0" y="716.5" text-anchor="middle" font-size="30" font-weight="bold" fill="#0f2238">3 min</text><text x="600" y="792" text-anchor="middle" font-size="25" font-weight="bold" fill="#0f2238">Total: 60 minutes. A month that will not reconcile is not closed: mark it open with a note.</text></g></svg>