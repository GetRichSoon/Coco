<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" width="1200" height="690" role="img" aria-label="The three states of a sale and of a bill and what is recorded at each"><rect width="1200" height="690" fill="#f4efe6"/><g font-family="Georgia, 'Segoe UI', serif" fill="#0f2238"><text x="600" y="55" text-anchor="middle" font-size="36" font-weight="bold" fill="#0f2238">Income is recorded once, expenses are recorded once</text><text x="40" y="120" text-anchor="start" font-size="30" font-weight="bold" fill="#0f2238">A SALE</text><rect x="40" y="140" width="320" height="170" rx="14" fill="#f4efe6" stroke="#0f2238" stroke-width="4"/><text x="200.0" y="200.29999999999998" text-anchor="middle" font-size="26" font-weight="bold" fill="#0f2238">1. Agreed</text><text x="200.0" y="234.1" text-anchor="middle" font-size="26" font-weight="normal" fill="#0f2238">Contract or quote</text><text x="200.0" y="267.9" text-anchor="middle" font-size="26" font-weight="normal" fill="#0f2238">NOTHING recorded</text><rect x="440" y="140" width="330" height="170" rx="14" fill="#0f2238"/><text x="605.0" y="200.29999999999998" text-anchor="middle" font-size="26" font-weight="bold" fill="#f4efe6">2. Invoiced</text><text x="605.0" y="234.1" text-anchor="middle" font-size="26" font-weight="normal" fill="#f4efe6">Debit Receivables</text><text x="605.0" y="267.9" text-anchor="middle" font-size="26" font-weight="normal" fill="#f4efe6">Credit Sales</text><rect x="850" y="140" width="310" height="170" rx="14" fill="#0f2238"/><text x="1005.0" y="200.29999999999998" text-anchor="middle" font-size="26" font-weight="bold" fill="#f4efe6">3. Paid</text><text x="1005.0" y="234.1" text-anchor="middle" font-size="26" font-weight="normal" fill="#f4efe6">Debit Bank</text><text x="1005.0" y="267.9" text-anchor="middle" font-size="26" font-weight="normal" fill="#f4efe6">Credit Receivables</text><line x1="360" y1="225" x2="426" y2="225" stroke="#b87333" stroke-width="6"/><polygon points="440,225 418,211 418,239" fill="#b87333"/><line x1="770" y1="225" x2="836" y2="225" stroke="#b87333" stroke-width="6"/><polygon points="850,225 828,211 828,239" fill="#b87333"/><text x="605" y="345" text-anchor="middle" font-size="26" font-weight="bold" fill="#0f2238">Income is earned at step 2. Step 3 only moves one asset into another.</text><text x="40" y="420" text-anchor="start" font-size="30" font-weight="bold" fill="#0f2238">A BILL</text><rect x="40" y="440" width="320" height="170" rx="14" fill="#f4efe6" stroke="#0f2238" stroke-width="4"/><text x="200.0" y="500.3" text-anchor="middle" font-size="26" font-weight="bold" fill="#0f2238">1. Committed</text><text x="200.0" y="534.1" text-anchor="middle" font-size="26" font-weight="normal" fill="#0f2238">Order placed</text><text x="200.0" y="567.9" text-anchor="middle" font-size="26" font-weight="normal" fill="#0f2238">NOTHING recorded</text><rect x="440" y="440" width="330" height="170" rx="14" fill="#0f2238"/><text x="605.0" y="500.3" text-anchor="middle" font-size="26" font-weight="bold" fill="#f4efe6">2. Incurred</text><text x="605.0" y="534.1" text-anchor="middle" font-size="26" font-weight="normal" fill="#f4efe6">Debit Expense (or asset)</text><text x="605.0" y="567.9" text-anchor="middle" font-size="26" font-weight="normal" fill="#f4efe6">Credit Payables</text><rect x="850" y="440" width="310" height="170" rx="14" fill="#0f2238"/><text x="1005.0" y="500.3" text-anchor="middle" font-size="26" font-weight="bold" fill="#f4efe6">3. Paid</text><text x="1005.0" y="534.1" text-anchor="middle" font-size="26" font-weight="normal" fill="#f4efe6">Debit Payables</text><text x="1005.0" y="567.9" text-anchor="middle" font-size="26" font-weight="normal" fill="#f4efe6">Credit Bank</text><line x1="360" y1="525" x2="426" y2="525" stroke="#b87333" stroke-width="6"/><polygon points="440,525 418,511 418,539" fill="#b87333"/><line x1="770" y1="525" x2="836" y2="525" stroke="#b87333" stroke-width="6"/><polygon points="850,525 828,511 828,539" fill="#b87333"/><text x="605" y="645" text-anchor="middle" font-size="26" font-weight="bold" fill="#0f2238">Small card purchase: steps 2 and 3 happen together. Debit Expense, Credit Bank.</text></g></svg>