<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 715" width="1200" height="715" role="img" aria-label="The bank reconciliation: three piles and the proving calculation"><rect width="1200" height="715" fill="#f4efe6"/><g font-family="Georgia, 'Segoe UI', serif" fill="#0f2238"><text x="600" y="55" text-anchor="middle" font-size="38" font-weight="bold" fill="#0f2238">The bank reconciliation, once a month</text><rect x="40" y="100" width="1120" height="80" rx="14" fill="#f4efe6" stroke="#0f2238" stroke-width="4"/><text x="600.0" y="149.1" text-anchor="middle" font-size="26" font-weight="normal" fill="#0f2238">Tick every statement line against your books. What is left falls into three piles.</text><rect x="40" y="220" width="350" height="250" rx="14" fill="#0f2238"/><text x="215.0" y="291.0" text-anchor="middle" font-size="24" font-weight="bold" fill="#f4efe6">On the statement,</text><text x="215.0" y="322.2" text-anchor="middle" font-size="24" font-weight="normal" fill="#f4efe6">not in your books</text><text x="215.0" y="353.4" text-anchor="middle" font-size="24" font-weight="normal" fill="#f4efe6"></text><text x="215.0" y="384.6" text-anchor="middle" font-size="24" font-weight="normal" fill="#f4efe6">You forgot it (bank charge,</text><text x="215.0" y="415.8" text-anchor="middle" font-size="24" font-weight="normal" fill="#f4efe6">direct debit). Record it now.</text><rect x="425" y="220" width="350" height="250" rx="14" fill="#0f2238"/><text x="600.0" y="291.0" text-anchor="middle" font-size="24" font-weight="bold" fill="#f4efe6">In your books,</text><text x="600.0" y="322.2" text-anchor="middle" font-size="24" font-weight="normal" fill="#f4efe6">not on the statement</text><text x="600.0" y="353.4" text-anchor="middle" font-size="24" font-weight="normal" fill="#f4efe6"></text><text x="600.0" y="384.6" text-anchor="middle" font-size="24" font-weight="normal" fill="#f4efe6">Usually timing (uncleared).</text><text x="600.0" y="415.8" text-anchor="middle" font-size="24" font-weight="normal" fill="#f4efe6">Chase it after two months.</text><rect x="810" y="220" width="350" height="250" rx="14" fill="#0f2238"/><text x="985.0" y="291.0" text-anchor="middle" font-size="24" font-weight="bold" fill="#f4efe6">In both, but different</text><text x="985.0" y="322.2" text-anchor="middle" font-size="24" font-weight="normal" fill="#f4efe6"></text><text x="985.0" y="353.4" text-anchor="middle" font-size="24" font-weight="normal" fill="#f4efe6">A typed amount or a wrong</text><text x="985.0" y="384.6" text-anchor="middle" font-size="24" font-weight="normal" fill="#f4efe6">amount taken. Fix your books</text><text x="985.0" y="415.8" text-anchor="middle" font-size="24" font-weight="normal" fill="#f4efe6">or query the other side.</text><text x="600" y="535" text-anchor="middle" font-size="28" font-weight="bold" fill="#0f2238">Then prove it, and write the proof down:</text><rect x="40" y="560" width="1120" height="70" rx="14" fill="#b87333"/><text x="600.0" y="604.45" text-anchor="middle" font-size="27" font-weight="bold" fill="#0f2238">Statement + uncleared deposits - uncleared payments = your books</text><text x="600" y="680" text-anchor="middle" font-size="25" font-weight="normal" fill="#0f2238">Do this for every account with money in it: current, card, savings, payment processor.</text></g></svg>