<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-label="The five kinds of account and which side increases each"><rect width="1200" height="660" fill="#f4efe6"/><g font-family="Georgia, 'Segoe UI', serif" fill="#0f2238"><text x="600" y="60" text-anchor="middle" font-size="38" font-weight="bold" fill="#0f2238">The five kinds of account</text><rect x="40" y="100" width="700" height="70" rx="14" fill="#b87333"/><text x="390.0" y="144.1" text-anchor="middle" font-size="26" font-weight="bold" fill="#0f2238">THINGS at one moment = balance sheet</text><rect x="780" y="100" width="380" height="70" rx="14" fill="#b87333"/><text x="970.0" y="142.7" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f2238">PERFORMANCE = profit and loss</text><rect x="40" y="200" width="220" height="190" rx="14" fill="#0f2238"/><text x="150.0" y="256.59999999999997" text-anchor="middle" font-size="24" font-weight="bold" fill="#f4efe6">Assets</text><text x="150.0" y="287.79999999999995" text-anchor="middle" font-size="24" font-weight="normal" fill="#f4efe6">what you own or</text><text x="150.0" y="319.0" text-anchor="middle" font-size="24" font-weight="normal" fill="#f4efe6">are owed</text><text x="150.0" y="350.2" text-anchor="middle" font-size="24" font-weight="normal" fill="#f4efe6">UP: DEBIT</text><rect x="280" y="200" width="220" height="190" rx="14" fill="#0f2238"/><text x="390.0" y="256.59999999999997" text-anchor="middle" font-size="24" font-weight="bold" fill="#f4efe6">Liabilities</text><text x="390.0" y="287.79999999999995" text-anchor="middle" font-size="24" font-weight="normal" fill="#f4efe6">what you owe</text><text x="390.0" y="319.0" text-anchor="middle" font-size="24" font-weight="normal" fill="#f4efe6"></text><text x="390.0" y="350.2" text-anchor="middle" font-size="24" font-weight="normal" fill="#f4efe6">UP: CREDIT</text><rect x="520" y="200" width="220" height="190" rx="14" fill="#0f2238"/><text x="630.0" y="259.8" text-anchor="middle" font-size="22" font-weight="bold" fill="#f4efe6">Equity</text><text x="630.0" y="288.40000000000003" text-anchor="middle" font-size="22" font-weight="normal" fill="#f4efe6">what the business</text><text x="630.0" y="317.0" text-anchor="middle" font-size="22" font-weight="normal" fill="#f4efe6">owes you, the owner</text><text x="630.0" y="345.6" text-anchor="middle" font-size="22" font-weight="normal" fill="#f4efe6">UP: CREDIT</text><rect x="780" y="200" width="180" height="190" rx="14" fill="#3aa6a0"/><text x="870.0" y="259.8" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f2238">Income</text><text x="870.0" y="288.40000000000003" text-anchor="middle" font-size="22" font-weight="normal" fill="#0f2238">value earned</text><text x="870.0" y="317.0" text-anchor="middle" font-size="22" font-weight="normal" fill="#0f2238"></text><text x="870.0" y="345.6" text-anchor="middle" font-size="22" font-weight="normal" fill="#0f2238">UP: CREDIT</text><rect x="980" y="200" width="180" height="190" rx="14" fill="#3aa6a0"/><text x="1070.0" y="259.8" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f2238">Expenses</text><text x="1070.0" y="288.40000000000003" text-anchor="middle" font-size="22" font-weight="normal" fill="#0f2238">value consumed</text><text x="1070.0" y="317.0" text-anchor="middle" font-size="22" font-weight="normal" fill="#0f2238"></text><text x="1070.0" y="345.6" text-anchor="middle" font-size="22" font-weight="normal" fill="#0f2238">UP: DEBIT</text><rect x="40" y="430" width="1120" height="90" rx="14" fill="#f4efe6" stroke="#0f2238" stroke-width="4"/><text x="600.0" y="485.5" text-anchor="middle" font-size="30" font-weight="bold" fill="#0f2238">Every transaction has two halves, and debits always equal credits</text><text x="600" y="580" text-anchor="middle" font-size="28" font-weight="bold" fill="#0f2238">Assets = Liabilities + Equity   (true at every instant if both halves were recorded)</text><text x="600" y="625" text-anchor="middle" font-size="24" font-weight="normal" fill="#0f2238">Debit = left, credit = right. Assets and expenses go up on the left; all else on the right.</text></g></svg>