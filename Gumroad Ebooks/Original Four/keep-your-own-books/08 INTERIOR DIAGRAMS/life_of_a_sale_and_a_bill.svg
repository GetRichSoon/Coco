<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 870" width="1200" height="870" role="img" aria-label="The three states of a sale and of a bill and what is recorded at each"><rect width="1200" height="870" fill="#f4efe6"/><g font-family="Georgia, 'Segoe UI', serif" fill="#0f2238"><text x="600" y="58" text-anchor="middle" font-size="36" font-weight="bold" fill="#0f2238">Income is recorded once, expenses are recorded once</text><text x="40" y="125" text-anchor="start" font-size="34" font-weight="bold" fill="#0f2238">A SALE</text><rect x="40" y="145" width="350" height="190" rx="14" fill="#f4efe6" stroke="#0f2238" stroke-width="4"/><text x="215" y="205" text-anchor="middle" font-size="32" font-weight="bold" fill="#0f2238">1. Agreed</text><text x="215" y="252" text-anchor="middle" font-size="32" font-weight="normal" fill="#0f2238">Contract or quote</text><text x="215" y="297" text-anchor="middle" font-size="32" font-weight="normal" fill="#0f2238">NOTHING recorded</text><rect x="425" y="145" width="350" height="190" rx="14" fill="#0f2238"/><text x="600" y="205" text-anchor="middle" font-size="32" font-weight="bold" fill="#f4efe6">2. Invoiced</text><text x="600" y="252" text-anchor="middle" font-size="32" font-weight="normal" fill="#f4efe6">Debit Receivables</text><text x="600" y="297" text-anchor="middle" font-size="32" font-weight="normal" fill="#f4efe6">Credit Sales</text><rect x="810" y="145" width="350" height="190" rx="14" fill="#0f2238"/><text x="985" y="205" text-anchor="middle" font-size="32" font-weight="bold" fill="#f4efe6">3. Paid</text><text x="985" y="252" text-anchor="middle" font-size="32" font-weight="normal" fill="#f4efe6">Debit Bank</text><text x="985" y="297" text-anchor="middle" font-size="32" font-weight="normal" fill="#f4efe6">Credit Receivables</text><line x1="388" y1="240" x2="412" y2="240" stroke="#b87333" stroke-width="6"/><polygon points="425,240 406,226 406,254" fill="#b87333"/><line x1="773" y1="240" x2="797" y2="240" stroke="#b87333" stroke-width="6"/><polygon points="810,240 791,226 791,254" fill="#b87333"/><text x="600" y="390" text-anchor="middle" font-size="32" font-weight="bold" fill="#0f2238">Income is earned at step 2. Step 3 only</text><text x="600" y="432" text-anchor="middle" font-size="32" font-weight="bold" fill="#0f2238">moves one asset into another.</text><text x="40" y="500" text-anchor="start" font-size="34" font-weight="bold" fill="#0f2238">A BILL</text><rect x="40" y="520" width="350" height="190" rx="14" fill="#f4efe6" stroke="#0f2238" stroke-width="4"/><text x="215" y="580" text-anchor="middle" font-size="32" font-weight="bold" fill="#0f2238">1. Committed</text><text x="215" y="627" text-anchor="middle" font-size="32" font-weight="normal" fill="#0f2238">Order placed</text><text x="215" y="672" text-anchor="middle" font-size="32" font-weight="normal" fill="#0f2238">NOTHING recorded</text><rect x="425" y="520" width="350" height="190" rx="14" fill="#0f2238"/><text x="600" y="580" text-anchor="middle" font-size="32" font-weight="bold" fill="#f4efe6">2. Incurred</text><text x="600" y="627" text-anchor="middle" font-size="32" font-weight="normal" fill="#f4efe6">Debit Expense</text><text x="600" y="672" text-anchor="middle" font-size="32" font-weight="normal" fill="#f4efe6">Credit Payables</text><rect x="810" y="520" width="350" height="190" rx="14" fill="#0f2238"/><text x="985" y="580" text-anchor="middle" font-size="32" font-weight="bold" fill="#f4efe6">3. Paid</text><text x="985" y="627" text-anchor="middle" font-size="32" font-weight="normal" fill="#f4efe6">Debit Payables</text><text x="985" y="672" text-anchor="middle" font-size="32" font-weight="normal" fill="#f4efe6">Credit Bank</text><line x1="388" y1="615" x2="412" y2="615" stroke="#b87333" stroke-width="6"/><polygon points="425,615 406,601 406,629" fill="#b87333"/><line x1="773" y1="615" x2="797" y2="615" stroke="#b87333" stroke-width="6"/><polygon points="810,615 791,601 791,629" fill="#b87333"/><text x="600" y="765" text-anchor="middle" font-size="32" font-weight="bold" fill="#0f2238">Small card purchase: steps 2 and 3 happen</text><text x="600" y="807" text-anchor="middle" font-size="32" font-weight="bold" fill="#0f2238">together. Debit Expense, Credit Bank.</text></g></svg>