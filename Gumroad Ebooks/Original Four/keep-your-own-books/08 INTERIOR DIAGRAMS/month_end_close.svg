<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1160" width="1200" height="1160" role="img" aria-label="The seven step month end close with minutes"><rect width="1200" height="1160" fill="#f4efe6"/><g font-family="Georgia, 'Segoe UI', serif" fill="#0f2238"><text x="600" y="58" text-anchor="middle" font-size="40" font-weight="bold" fill="#0f2238">The month-end close: one hour, seven steps</text><circle cx="62" cy="155.0" r="30" fill="#b87333"/><text x="62" y="167.0" text-anchor="middle" font-size="34" font-weight="bold" fill="#0f2238">1</text><rect x="110" y="100" width="810" height="110" rx="14" fill="#0f2238"/><text x="135" y="146" text-anchor="start" font-size="32" font-weight="bold" fill="#f4efe6">Record everything outstanding</text><text x="135" y="190" text-anchor="start" font-size="32" font-weight="normal" fill="#f4efe6">Every invoice, bill and receipt</text><rect x="940" y="100" width="220" height="110" rx="14" fill="#3aa6a0"/><text x="1050" y="167.0" text-anchor="middle" font-size="34" font-weight="bold" fill="#0f2238">15 min</text><circle cx="62" cy="279.0" r="30" fill="#b87333"/><text x="62" y="291.0" text-anchor="middle" font-size="34" font-weight="bold" fill="#0f2238">2</text><rect x="110" y="224" width="810" height="110" rx="14" fill="#0f2238"/><text x="135" y="270" text-anchor="start" font-size="32" font-weight="bold" fill="#f4efe6">Reconcile every account</text><text x="135" y="314" text-anchor="start" font-size="32" font-weight="normal" fill="#f4efe6">If it will not balance, stop and find it</text><rect x="940" y="224" width="220" height="110" rx="14" fill="#3aa6a0"/><text x="1050" y="291.0" text-anchor="middle" font-size="34" font-weight="bold" fill="#0f2238">20 min</text><circle cx="62" cy="403.0" r="30" fill="#b87333"/><text x="62" y="415.0" text-anchor="middle" font-size="34" font-weight="bold" fill="#0f2238">3</text><rect x="110" y="348" width="810" height="110" rx="14" fill="#0f2238"/><text x="135" y="394" text-anchor="start" font-size="32" font-weight="bold" fill="#f4efe6">Check the trial balance</text><text x="135" y="438" text-anchor="start" font-size="32" font-weight="normal" fill="#f4efe6">Debits equal credits</text><rect x="940" y="348" width="220" height="110" rx="14" fill="#3aa6a0"/><text x="1050" y="415.0" text-anchor="middle" font-size="34" font-weight="bold" fill="#0f2238">2 min</text><circle cx="62" cy="548.0" r="30" fill="#b87333"/><text x="62" y="560.0" text-anchor="middle" font-size="34" font-weight="bold" fill="#0f2238">4</text><rect x="110" y="472" width="810" height="152" rx="14" fill="#0f2238"/><text x="135" y="518" text-anchor="start" font-size="32" font-weight="bold" fill="#f4efe6">Review four accounts</text><text x="135" y="562" text-anchor="start" font-size="32" font-weight="normal" fill="#f4efe6">Other expenses, Unidentified receipts,</text><text x="135" y="604" text-anchor="start" font-size="32" font-weight="normal" fill="#f4efe6">Unearned income, Drawings</text><rect x="940" y="472" width="220" height="152" rx="14" fill="#3aa6a0"/><text x="1050" y="560.0" text-anchor="middle" font-size="34" font-weight="bold" fill="#0f2238">10 min</text><circle cx="62" cy="693.0" r="30" fill="#b87333"/><text x="62" y="705.0" text-anchor="middle" font-size="34" font-weight="bold" fill="#0f2238">5</text><rect x="110" y="638" width="810" height="110" rx="14" fill="#0f2238"/><text x="135" y="684" text-anchor="start" font-size="32" font-weight="bold" fill="#f4efe6">Read the aged receivables</text><text x="135" y="728" text-anchor="start" font-size="32" font-weight="normal" fill="#f4efe6">Anything over 60 days needs action today</text><rect x="940" y="638" width="220" height="110" rx="14" fill="#3aa6a0"/><text x="1050" y="705.0" text-anchor="middle" font-size="34" font-weight="bold" fill="#0f2238">5 min</text><circle cx="62" cy="817.0" r="30" fill="#b87333"/><text x="62" y="829.0" text-anchor="middle" font-size="34" font-weight="bold" fill="#0f2238">6</text><rect x="110" y="762" width="810" height="110" rx="14" fill="#0f2238"/><text x="135" y="808" text-anchor="start" font-size="32" font-weight="bold" fill="#f4efe6">Read the two statements</text><text x="135" y="852" text-anchor="start" font-size="32" font-weight="normal" fill="#f4efe6">Profit and loss, balance sheet</text><rect x="940" y="762" width="220" height="110" rx="14" fill="#3aa6a0"/><text x="1050" y="829.0" text-anchor="middle" font-size="34" font-weight="bold" fill="#0f2238">5 min</text><circle cx="62" cy="941.0" r="30" fill="#b87333"/><text x="62" y="953.0" text-anchor="middle" font-size="34" font-weight="bold" fill="#0f2238">7</text><rect x="110" y="886" width="810" height="110" rx="14" fill="#0f2238"/><text x="135" y="932" text-anchor="start" font-size="32" font-weight="bold" fill="#f4efe6">Close and record it</text><text x="135" y="976" text-anchor="start" font-size="32" font-weight="normal" fill="#f4efe6">Mark closed with the date, note judgements</text><rect x="940" y="886" width="220" height="110" rx="14" fill="#3aa6a0"/><text x="1050" y="953.0" text-anchor="middle" font-size="34" font-weight="bold" fill="#0f2238">3 min</text><text x="600" y="1055" text-anchor="middle" font-size="34" font-weight="bold" fill="#0f2238">Total: 60 minutes.</text><text x="600" y="1102" text-anchor="middle" font-size="32" font-weight="bold" fill="#0f2238">A month that will not reconcile is not closed:</text><text x="600" y="1144" text-anchor="middle" font-size="32" font-weight="bold" fill="#0f2238">mark it open, with a note.</text></g></svg>