<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" width="1200" height="1000" role="img" aria-label="The five kinds of account and which side increases each"><rect width="1200" height="1000" fill="#f4efe6"/><g font-family="Georgia, 'Segoe UI', serif" fill="#0f2238"><text x="600" y="62" text-anchor="middle" font-size="40" font-weight="bold" fill="#0f2238">The five kinds of account</text><rect x="40" y="95" width="1120" height="62" rx="14" fill="#b87333"/><text x="600" y="138" text-anchor="middle" font-size="32" font-weight="bold" fill="#0f2238">THINGS at one moment = balance sheet</text><rect x="40" y="170" width="1120" height="80" rx="14" fill="#0f2238"/><text x="65" y="222" text-anchor="start" font-size="34" font-weight="bold" fill="#f4efe6">Assets</text><text x="330" y="222" text-anchor="start" font-size="32" font-weight="normal" fill="#f4efe6">what you own or are owed</text><text x="1135" y="222" text-anchor="end" font-size="32" font-weight="bold" fill="#f4efe6">UP: DEBIT</text><rect x="40" y="260" width="1120" height="80" rx="14" fill="#0f2238"/><text x="65" y="312" text-anchor="start" font-size="34" font-weight="bold" fill="#f4efe6">Liabilities</text><text x="330" y="312" text-anchor="start" font-size="32" font-weight="normal" fill="#f4efe6">what you owe</text><text x="1135" y="312" text-anchor="end" font-size="32" font-weight="bold" fill="#f4efe6">UP: CREDIT</text><rect x="40" y="350" width="1120" height="80" rx="14" fill="#0f2238"/><text x="65" y="402" text-anchor="start" font-size="34" font-weight="bold" fill="#f4efe6">Equity</text><text x="330" y="402" text-anchor="start" font-size="32" font-weight="normal" fill="#f4efe6">what the business owes you</text><text x="1135" y="402" text-anchor="end" font-size="32" font-weight="bold" fill="#f4efe6">UP: CREDIT</text><rect x="40" y="455" width="1120" height="62" rx="14" fill="#b87333"/><text x="600" y="498" text-anchor="middle" font-size="32" font-weight="bold" fill="#0f2238">PERFORMANCE over a period = profit and loss</text><rect x="40" y="530" width="1120" height="80" rx="14" fill="#3aa6a0"/><text x="65" y="582" text-anchor="start" font-size="34" font-weight="bold" fill="#0f2238">Income</text><text x="330" y="582" text-anchor="start" font-size="32" font-weight="normal" fill="#0f2238">value earned</text><text x="1135" y="582" text-anchor="end" font-size="32" font-weight="bold" fill="#0f2238">UP: CREDIT</text><rect x="40" y="620" width="1120" height="80" rx="14" fill="#3aa6a0"/><text x="65" y="672" text-anchor="start" font-size="34" font-weight="bold" fill="#0f2238">Expenses</text><text x="330" y="672" text-anchor="start" font-size="32" font-weight="normal" fill="#0f2238">value consumed</text><text x="1135" y="672" text-anchor="end" font-size="32" font-weight="bold" fill="#0f2238">UP: DEBIT</text><rect x="40" y="725" width="1120" height="90" rx="14" fill="#f4efe6" stroke="#0f2238" stroke-width="4"/><text x="600" y="780" text-anchor="middle" font-size="32" font-weight="bold" fill="#0f2238">Every transaction has two halves; debits equal credits</text><text x="600" y="875" text-anchor="middle" font-size="38" font-weight="bold" fill="#0f2238">Assets = Liabilities + Equity</text><text x="600" y="925" text-anchor="middle" font-size="32" font-weight="normal" fill="#0f2238">Debit = left, credit = right. Assets and expenses go up</text><text x="600" y="965" text-anchor="middle" font-size="32" font-weight="normal" fill="#0f2238">on the left; everything else goes up on the right.</text></g></svg>