<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 960" width="1200" height="960" role="img" aria-label="The bank reconciliation: three piles and the proving calculation"><rect width="1200" height="960" fill="#f4efe6"/><g font-family="Georgia, 'Segoe UI', serif" fill="#0f2238"><text x="600" y="58" text-anchor="middle" font-size="40" font-weight="bold" fill="#0f2238">The bank reconciliation, once a month</text><rect x="40" y="90" width="1120" height="120" rx="14" fill="#f4efe6" stroke="#0f2238" stroke-width="4"/><text x="600" y="140" text-anchor="middle" font-size="32" font-weight="normal" fill="#0f2238">Tick every statement line against your books.</text><text x="600" y="184" text-anchor="middle" font-size="32" font-weight="normal" fill="#0f2238">What is left falls into three piles.</text><rect x="40" y="235" width="1120" height="115" rx="14" fill="#0f2238"/><text x="600" y="283" text-anchor="middle" font-size="32" font-weight="bold" fill="#f4efe6">On the statement, not in your books</text><text x="600" y="327" text-anchor="middle" font-size="32" font-weight="normal" fill="#f4efe6">You forgot it (bank charge, direct debit). Record it now.</text><rect x="40" y="365" width="1120" height="115" rx="14" fill="#0f2238"/><text x="600" y="413" text-anchor="middle" font-size="32" font-weight="bold" fill="#f4efe6">In your books, not on the statement</text><text x="600" y="457" text-anchor="middle" font-size="32" font-weight="normal" fill="#f4efe6">Usually timing (uncleared). Chase it after two months.</text><rect x="40" y="495" width="1120" height="115" rx="14" fill="#0f2238"/><text x="600" y="543" text-anchor="middle" font-size="32" font-weight="bold" fill="#f4efe6">In both, but different</text><text x="600" y="587" text-anchor="middle" font-size="32" font-weight="normal" fill="#f4efe6">A typed or wrong amount. Fix your books or query it.</text><text x="600" y="665" text-anchor="middle" font-size="34" font-weight="bold" fill="#0f2238">Then prove it, and write the proof down:</text><rect x="40" y="690" width="1120" height="120" rx="14" fill="#b87333"/><text x="600" y="742" text-anchor="middle" font-size="32" font-weight="bold" fill="#0f2238">Statement + uncleared deposits</text><text x="600" y="788" text-anchor="middle" font-size="32" font-weight="bold" fill="#0f2238">- uncleared payments = your books</text><text x="600" y="865" text-anchor="middle" font-size="32" font-weight="normal" fill="#0f2238">Do this for every account with money in it:</text><text x="600" y="907" text-anchor="middle" font-size="32" font-weight="normal" fill="#0f2238">current, card, savings, payment processor.</text></g></svg>