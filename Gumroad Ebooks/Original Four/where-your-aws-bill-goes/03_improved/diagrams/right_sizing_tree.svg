<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" width="1200" height="830" role="img" aria-label="Right-sizing decision order"><rect width="1200" height="830" fill="#f4efe6"/><text x="600.0" y="58" font-size="40" fill="#0f2238" font-weight="bold" style="font-family:Georgia,serif" text-anchor="middle">Right-sizing: ask in this order</text><text x="600.0" y="98" font-size="26" fill="#b87333" font-weight="normal" style="font-family:'Segoe UI',Arial,sans-serif" text-anchor="middle">Measure two weeks or more, at the 95th percentile</text><rect x="40" y="130" width="540" height="105" rx="12" fill="#0f2238"/><text x="310" y="194" font-size="28" fill="#f4efe6" font-weight="bold" style="font-family:'Segoe UI',Arial,sans-serif" text-anchor="middle">Is anything using it?</text><path d="M580 182 h70" stroke="#b87333" stroke-width="6"/><path d="M640 166 l18 16 l-18 16" fill="none" stroke="#b87333" stroke-width="6"/><text x="615" y="166" font-size="26" fill="#b87333" font-weight="bold" style="font-family:'Segoe UI',Arial,sans-serif" text-anchor="middle">No</text><rect x="670" y="130" width="490" height="105" rx="12" fill="#fff" stroke="#3aa6a0" stroke-width="3"/><text x="690" y="176" font-size="27" fill="#0f2238" font-weight="bold" style="font-family:'Segoe UI',Arial,sans-serif" text-anchor="start">Delete it (go back to</text><text x="690" y="212" font-size="27" fill="#0f2238" font-weight="bold" style="font-family:'Segoe UI',Arial,sans-serif" text-anchor="start">idle resources)</text><rect x="40" y="265" width="540" height="105" rx="12" fill="#0f2238"/><text x="310" y="329" font-size="28" fill="#f4efe6" font-weight="bold" style="font-family:'Segoe UI',Arial,sans-serif" text-anchor="middle">One dimension saturated, others idle?</text><path d="M580 317 h70" stroke="#b87333" stroke-width="6"/><path d="M640 301 l18 16 l-18 16" fill="none" stroke="#b87333" stroke-width="6"/><text x="615" y="301" font-size="26" fill="#b87333" font-weight="bold" style="font-family:'Segoe UI',Arial,sans-serif" text-anchor="middle">Yes</text><rect x="670" y="265" width="490" height="105" rx="12" fill="#fff" stroke="#3aa6a0" stroke-width="3"/><text x="690" y="311" font-size="27" fill="#0f2238" font-weight="bold" style="font-family:'Segoe UI',Arial,sans-serif" text-anchor="start">Change the family, not</text><text x="690" y="347" font-size="27" fill="#0f2238" font-weight="bold" style="font-family:'Segoe UI',Arial,sans-serif" text-anchor="start">the size</text><rect x="40" y="400" width="540" height="105" rx="12" fill="#0f2238"/><text x="310" y="464" font-size="28" fill="#f4efe6" font-weight="bold" style="font-family:'Segoe UI',Arial,sans-serif" text-anchor="middle">Everything comfortably under-used?</text><path d="M580 452 h70" stroke="#b87333" stroke-width="6"/><path d="M640 436 l18 16 l-18 16" fill="none" stroke="#b87333" stroke-width="6"/><text x="615" y="436" font-size="26" fill="#b87333" font-weight="bold" style="font-family:'Segoe UI',Arial,sans-serif" text-anchor="middle">Yes</text><rect x="670" y="400" width="490" height="105" rx="12" fill="#fff" stroke="#3aa6a0" stroke-width="3"/><text x="690" y="446" font-size="27" fill="#0f2238" font-weight="bold" style="font-family:'Segoe UI',Arial,sans-serif" text-anchor="start">Reduce one step, watch a</text><text x="690" y="482" font-size="27" fill="#0f2238" font-weight="bold" style="font-family:'Segoe UI',Arial,sans-serif" text-anchor="start">full cycle, repeat</text><rect x="40" y="535" width="540" height="105" rx="12" fill="#0f2238"/><text x="310" y="599" font-size="28" fill="#f4efe6" font-weight="bold" style="font-family:'Segoe UI',Arial,sans-serif" text-anchor="middle">Saturated at peak, idle otherwise?</text><path d="M580 587 h70" stroke="#b87333" stroke-width="6"/><path d="M640 571 l18 16 l-18 16" fill="none" stroke="#b87333" stroke-width="6"/><text x="615" y="571" font-size="26" fill="#b87333" font-weight="bold" style="font-family:'Segoe UI',Arial,sans-serif" text-anchor="middle">Yes</text><rect x="670" y="535" width="490" height="105" rx="12" fill="#fff" stroke="#3aa6a0" stroke-width="3"/><text x="690" y="581" font-size="27" fill="#0f2238" font-weight="bold" style="font-family:'Segoe UI',Arial,sans-serif" text-anchor="start">Scale out instead of</text><text x="690" y="617" font-size="27" fill="#0f2238" font-weight="bold" style="font-family:'Segoe UI',Arial,sans-serif" text-anchor="start">sizing up</text><rect x="40" y="670" width="540" height="105" rx="12" fill="#0f2238"/><text x="310" y="734" font-size="28" fill="#f4efe6" font-weight="bold" style="font-family:'Segoe UI',Arial,sans-serif" text-anchor="middle">A newer generation available?</text><path d="M580 722 h70" stroke="#b87333" stroke-width="6"/><path d="M640 706 l18 16 l-18 16" fill="none" stroke="#b87333" stroke-width="6"/><text x="615" y="706" font-size="26" fill="#b87333" font-weight="bold" style="font-family:'Segoe UI',Arial,sans-serif" text-anchor="middle">Yes</text><rect x="670" y="670" width="490" height="105" rx="12" fill="#fff" stroke="#3aa6a0" stroke-width="3"/><text x="690" y="716" font-size="27" fill="#0f2238" font-weight="bold" style="font-family:'Segoe UI',Arial,sans-serif" text-anchor="start">Upgrade: lowest-risk</text><text x="690" y="752" font-size="27" fill="#0f2238" font-weight="bold" style="font-family:'Segoe UI',Arial,sans-serif" text-anchor="start">change on the list</text></svg>