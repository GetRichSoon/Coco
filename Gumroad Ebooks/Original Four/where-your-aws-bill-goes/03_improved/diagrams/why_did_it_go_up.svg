<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" width="1200" height="880" role="img" aria-label="Five step procedure for investigating a bill increase"><rect width="1200" height="880" fill="#f4efe6"/><text x="600.0" y="58" font-size="40" fill="#0f2238" font-weight="bold" style="font-family:Georgia,serif" text-anchor="middle">Why did the bill go up?</text><text x="600.0" y="98" font-size="26" fill="#b87333" font-weight="normal" style="font-family:'Segoe UI',Arial,sans-serif" text-anchor="middle">Do the steps in order; stop as soon as you know</text><rect x="40" y="130" width="1120" height="124" rx="12" fill="#fff" stroke="#0f2238" stroke-width="2"/><circle cx="110" cy="192" r="38" fill="#0f2238"/><text x="110" y="204" font-size="40" fill="#f4efe6" font-weight="bold" style="font-family:Georgia,serif" text-anchor="middle">1</text><text x="175" y="184" font-size="32" fill="#0f2238" font-weight="bold" style="font-family:'Segoe UI',Arial,sans-serif" text-anchor="start">Group by service</text><text x="175" y="226" font-size="27" fill="#33475b" font-weight="normal" style="font-family:'Segoe UI',Arial,sans-serif" text-anchor="start">Compare two periods. One or two services explain the jump.</text><path d="M110 254 v24" stroke="#b87333" stroke-width="5"/><path d="M98 268 l12 12 l12 -12" fill="none" stroke="#b87333" stroke-width="5"/><rect x="40" y="278" width="1120" height="124" rx="12" fill="#fff" stroke="#0f2238" stroke-width="2"/><circle cx="110" cy="340" r="38" fill="#0f2238"/><text x="110" y="352" font-size="40" fill="#f4efe6" font-weight="bold" style="font-family:Georgia,serif" text-anchor="middle">2</text><text x="175" y="332" font-size="32" fill="#0f2238" font-weight="bold" style="font-family:'Segoe UI',Arial,sans-serif" text-anchor="start">Filter to that service, group by usage type</text><text x="175" y="374" font-size="27" fill="#33475b" font-weight="normal" style="font-family:'Segoe UI',Arial,sans-serif" text-anchor="start">The usage type name is the meter. Do not skip this.</text><path d="M110 402 v24" stroke="#b87333" stroke-width="5"/><path d="M98 416 l12 12 l12 -12" fill="none" stroke="#b87333" stroke-width="5"/><rect x="40" y="426" width="1120" height="124" rx="12" fill="#fff" stroke="#0f2238" stroke-width="2"/><circle cx="110" cy="488" r="38" fill="#0f2238"/><text x="110" y="500" font-size="40" fill="#f4efe6" font-weight="bold" style="font-family:Georgia,serif" text-anchor="middle">3</text><text x="175" y="480" font-size="32" fill="#0f2238" font-weight="bold" style="font-family:'Segoe UI',Arial,sans-serif" text-anchor="start">Group by the dimension that matches the shape</text><text x="175" y="522" font-size="27" fill="#33475b" font-weight="normal" style="font-family:'Segoe UI',Arial,sans-serif" text-anchor="start">Time: instance type or region. Requests: operation. Transfer: usage type.</text><path d="M110 550 v24" stroke="#b87333" stroke-width="5"/><path d="M98 564 l12 12 l12 -12" fill="none" stroke="#b87333" stroke-width="5"/><rect x="40" y="574" width="1120" height="124" rx="12" fill="#fff" stroke="#0f2238" stroke-width="2"/><circle cx="110" cy="636" r="38" fill="#0f2238"/><text x="110" y="648" font-size="40" fill="#f4efe6" font-weight="bold" style="font-family:Georgia,serif" text-anchor="middle">4</text><text x="175" y="628" font-size="32" fill="#0f2238" font-weight="bold" style="font-family:'Segoe UI',Arial,sans-serif" text-anchor="start">Switch the metric from cost to usage</text><text x="175" y="670" font-size="27" fill="#33475b" font-weight="normal" style="font-family:'Segoe UI',Arial,sans-serif" text-anchor="start">More consumption is behaviour. More per unit is price, tier or commitment.</text><path d="M110 698 v24" stroke="#b87333" stroke-width="5"/><path d="M98 712 l12 12 l12 -12" fill="none" stroke="#b87333" stroke-width="5"/><rect x="40" y="722" width="1120" height="124" rx="12" fill="#fff" stroke="#0f2238" stroke-width="2"/><circle cx="110" cy="784" r="38" fill="#0f2238"/><text x="110" y="796" font-size="40" fill="#f4efe6" font-weight="bold" style="font-family:Georgia,serif" text-anchor="middle">5</text><text x="175" y="776" font-size="32" fill="#0f2238" font-weight="bold" style="font-family:'Segoe UI',Arial,sans-serif" text-anchor="start">Only now open the detailed report</text><text x="175" y="818" font-size="27" fill="#33475b" font-weight="normal" style="font-family:'Segoe UI',Arial,sans-serif" text-anchor="start">Per-resource truth lives in the Cost and Usage Report.</text></svg>