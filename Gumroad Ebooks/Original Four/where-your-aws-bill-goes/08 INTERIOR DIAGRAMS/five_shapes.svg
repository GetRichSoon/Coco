<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" role="img" aria-label="The five pricing shapes"><rect width="1200" height="780" fill="#f4efe6"/><text x="600.0" y="58" font-size="40" fill="#0f2238" font-weight="bold" style="font-family:Georgia,serif" text-anchor="middle">The five things you pay for</text><text x="600.0" y="98" font-size="26" fill="#b87333" font-weight="normal" style="font-family:'Segoe UI',Arial,sans-serif" text-anchor="middle">Sort any pricing page into these five</text><text x="62" y="150" font-size="24" fill="#3aa6a0" font-weight="bold" style="font-family:'Segoe UI',Arial,sans-serif" text-anchor="start">SHAPE</text><text x="300" y="150" font-size="24" fill="#3aa6a0" font-weight="bold" style="font-family:'Segoe UI',Arial,sans-serif" text-anchor="start">YOU PAY FOR</text><text x="640" y="150" font-size="24" fill="#3aa6a0" font-weight="bold" style="font-family:'Segoe UI',Arial,sans-serif" text-anchor="start">YOU CONTROL</text><text x="900" y="150" font-size="24" fill="#3aa6a0" font-weight="bold" style="font-family:'Segoe UI',Arial,sans-serif" text-anchor="start">BEHAVES LIKE</text><rect x="30" y="170" width="1140" height="102" rx="10" fill="#fff" stroke="#0f2238" stroke-width="2"/><rect x="30" y="170" width="14" height="102" rx="6" fill="#b87333"/><text x="62" y="232" font-size="32" fill="#0f2238" font-weight="bold" style="font-family:Georgia,serif" text-anchor="start">Time</text><text x="300" y="204.0" font-size="26" fill="#0f2238" font-weight="normal" style="font-family:'Segoe UI',Arial,sans-serif" text-anchor="start">how long a resource</text><text x="300" y="238.0" font-size="26" fill="#0f2238" font-weight="normal" style="font-family:'Segoe UI',Arial,sans-serif" text-anchor="start">exists</text><text x="640" y="221.0" font-size="26" fill="#0f2238" font-weight="normal" style="font-family:'Segoe UI',Arial,sans-serif" text-anchor="start">duration and size</text><text x="900" y="204.0" font-size="26" fill="#b87333" font-weight="bold" style="font-family:'Segoe UI',Arial,sans-serif" text-anchor="start">Bounded by the</text><text x="900" y="238.0" font-size="26" fill="#b87333" font-weight="bold" style="font-family:'Segoe UI',Arial,sans-serif" text-anchor="start">clock</text><rect x="30" y="288" width="1140" height="102" rx="10" fill="#fff" stroke="#0f2238" stroke-width="2"/><rect x="30" y="288" width="14" height="102" rx="6" fill="#3aa6a0"/><text x="62" y="350" font-size="32" fill="#0f2238" font-weight="bold" style="font-family:Georgia,serif" text-anchor="start">Storage</text><text x="300" y="322.0" font-size="26" fill="#0f2238" font-weight="normal" style="font-family:'Segoe UI',Arial,sans-serif" text-anchor="start">how much you keep, and</text><text x="300" y="356.0" font-size="26" fill="#0f2238" font-weight="normal" style="font-family:'Segoe UI',Arial,sans-serif" text-anchor="start">for how long</text><text x="640" y="322.0" font-size="26" fill="#0f2238" font-weight="normal" style="font-family:'Segoe UI',Arial,sans-serif" text-anchor="start">volume and</text><text x="640" y="356.0" font-size="26" fill="#0f2238" font-weight="normal" style="font-family:'Segoe UI',Arial,sans-serif" text-anchor="start">retention</text><text x="900" y="322.0" font-size="26" fill="#b87333" font-weight="bold" style="font-family:'Segoe UI',Arial,sans-serif" text-anchor="start">Grows while you</text><text x="900" y="356.0" font-size="26" fill="#b87333" font-weight="bold" style="font-family:'Segoe UI',Arial,sans-serif" text-anchor="start">do nothing</text><rect x="30" y="406" width="1140" height="102" rx="10" fill="#fff" stroke="#0f2238" stroke-width="2"/><rect x="30" y="406" width="14" height="102" rx="6" fill="#b87333"/><text x="62" y="468" font-size="32" fill="#0f2238" font-weight="bold" style="font-family:Georgia,serif" text-anchor="start">Requests</text><text x="300" y="457.0" font-size="26" fill="#0f2238" font-weight="normal" style="font-family:'Segoe UI',Arial,sans-serif" text-anchor="start">each call or operation</text><text x="640" y="440.0" font-size="26" fill="#0f2238" font-weight="normal" style="font-family:'Segoe UI',Arial,sans-serif" text-anchor="start">how chatty the</text><text x="640" y="474.0" font-size="26" fill="#0f2238" font-weight="normal" style="font-family:'Segoe UI',Arial,sans-serif" text-anchor="start">system is</text><text x="900" y="440.0" font-size="26" fill="#b87333" font-weight="bold" style="font-family:'Segoe UI',Arial,sans-serif" text-anchor="start">Can outgrow</text><text x="900" y="474.0" font-size="26" fill="#b87333" font-weight="bold" style="font-family:'Segoe UI',Arial,sans-serif" text-anchor="start">traffic</text><rect x="30" y="524" width="1140" height="102" rx="10" fill="#fff" stroke="#0f2238" stroke-width="2"/><rect x="30" y="524" width="14" height="102" rx="6" fill="#3aa6a0"/><text x="62" y="586" font-size="32" fill="#0f2238" font-weight="bold" style="font-family:Georgia,serif" text-anchor="start">Data transfer</text><text x="300" y="558.0" font-size="26" fill="#0f2238" font-weight="normal" style="font-family:'Segoe UI',Arial,sans-serif" text-anchor="start">bytes crossing a</text><text x="300" y="592.0" font-size="26" fill="#0f2238" font-weight="normal" style="font-family:'Segoe UI',Arial,sans-serif" text-anchor="start">boundary</text><text x="640" y="558.0" font-size="26" fill="#0f2238" font-weight="normal" style="font-family:'Segoe UI',Arial,sans-serif" text-anchor="start">topology and</text><text x="640" y="592.0" font-size="26" fill="#0f2238" font-weight="normal" style="font-family:'Segoe UI',Arial,sans-serif" text-anchor="start">traffic</text><text x="900" y="558.0" font-size="26" fill="#b87333" font-weight="bold" style="font-family:'Segoe UI',Arial,sans-serif" text-anchor="start">Priced by the</text><text x="900" y="592.0" font-size="26" fill="#b87333" font-weight="bold" style="font-family:'Segoe UI',Arial,sans-serif" text-anchor="start">boundary</text><rect x="30" y="642" width="1140" height="102" rx="10" fill="#fff" stroke="#0f2238" stroke-width="2"/><rect x="30" y="642" width="14" height="102" rx="6" fill="#b87333"/><text x="62" y="690" font-size="30" fill="#0f2238" font-weight="bold" style="font-family:Georgia,serif" text-anchor="start">Provisioned</text><text x="62" y="724" font-size="30" fill="#0f2238" font-weight="bold" style="font-family:Georgia,serif" text-anchor="start">capacity</text><text x="300" y="676.0" font-size="26" fill="#0f2238" font-weight="normal" style="font-family:'Segoe UI',Arial,sans-serif" text-anchor="start">capacity reserved, used</text><text x="300" y="710.0" font-size="26" fill="#0f2238" font-weight="normal" style="font-family:'Segoe UI',Arial,sans-serif" text-anchor="start">or not</text><text x="640" y="676.0" font-size="26" fill="#0f2238" font-weight="normal" style="font-family:'Segoe UI',Arial,sans-serif" text-anchor="start">the reservation</text><text x="640" y="710.0" font-size="26" fill="#0f2238" font-weight="normal" style="font-family:'Segoe UI',Arial,sans-serif" text-anchor="start">itself</text><text x="900" y="676.0" font-size="26" fill="#b87333" font-weight="bold" style="font-family:'Segoe UI',Arial,sans-serif" text-anchor="start">Never</text><text x="900" y="710.0" font-size="26" fill="#b87333" font-weight="bold" style="font-family:'Segoe UI',Arial,sans-serif" text-anchor="start">self-corrects</text></svg>