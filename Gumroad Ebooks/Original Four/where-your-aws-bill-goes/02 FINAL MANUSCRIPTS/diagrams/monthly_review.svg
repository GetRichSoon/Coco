<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 960" width="1200" height="960" role="img" aria-label="One hour monthly review timeline"><rect width="1200" height="960" fill="#f4efe6"/><text x="600.0" y="58" font-size="40" fill="#0f2238" font-weight="bold" style="font-family:Georgia,serif" text-anchor="middle">The monthly review: one hour</text><text x="600.0" y="98" font-size="26" fill="#b87333" font-weight="normal" style="font-family:'Segoe UI',Arial,sans-serif" text-anchor="middle">Same slot every month, in the first week after close</text><rect x="40" y="170" width="89.33333333333333" height="120" rx="8" fill="#3aa6a0"/><text x="84.66666666666666" y="245" font-size="40" fill="#f4efe6" font-weight="bold" style="font-family:Georgia,serif" text-anchor="middle">5</text><rect x="133.33333333333331" y="170" width="182.66666666666666" height="120" rx="8" fill="#0f2238"/><text x="224.66666666666663" y="245" font-size="40" fill="#f4efe6" font-weight="bold" style="font-family:Georgia,serif" text-anchor="middle">10</text><rect x="320.0" y="170" width="369.3333333333333" height="120" rx="8" fill="#b87333"/><text x="504.66666666666663" y="245" font-size="40" fill="#f4efe6" font-weight="bold" style="font-family:Georgia,serif" text-anchor="middle">20</text><rect x="693.3333333333333" y="170" width="182.66666666666666" height="120" rx="8" fill="#3aa6a0"/><text x="784.6666666666666" y="245" font-size="40" fill="#f4efe6" font-weight="bold" style="font-family:Georgia,serif" text-anchor="middle">10</text><rect x="879.9999999999999" y="170" width="182.66666666666666" height="120" rx="8" fill="#0f2238"/><text x="971.3333333333333" y="245" font-size="40" fill="#f4efe6" font-weight="bold" style="font-family:Georgia,serif" text-anchor="middle">10</text><rect x="1066.6666666666665" y="170" width="89.33333333333333" height="120" rx="8" fill="#b87333"/><text x="1111.3333333333333" y="245" font-size="40" fill="#f4efe6" font-weight="bold" style="font-family:Georgia,serif" text-anchor="middle">5</text><text x="600" y="330" font-size="24" fill="#33475b" font-weight="normal" style="font-family:'Segoe UI',Arial,sans-serif" text-anchor="middle">minutes</text><text x="50" y="380" font-size="28" fill="#b87333" font-weight="bold" style="font-family:'Segoe UI',Arial,sans-serif" text-anchor="start">1  The shape</text><text x="380" y="380" font-size="26" fill="#0f2238" font-weight="normal" style="font-family:'Segoe UI',Arial,sans-serif" text-anchor="start">Daily view, three months: flat, climbing, stepped or sawtooth?</text><text x="50" y="472" font-size="28" fill="#b87333" font-weight="bold" style="font-family:'Segoe UI',Arial,sans-serif" text-anchor="start">2  Compare by service</text><text x="380" y="472" font-size="26" fill="#0f2238" font-weight="normal" style="font-family:'Segoe UI',Arial,sans-serif" text-anchor="start">This month against last. A fall you cannot explain matters too.</text><text x="50" y="564" font-size="28" fill="#b87333" font-weight="bold" style="font-family:'Segoe UI',Arial,sans-serif" text-anchor="start">3  Top two movers</text><text x="380" y="564" font-size="26" fill="#0f2238" font-weight="normal" style="font-family:'Segoe UI',Arial,sans-serif" text-anchor="start">Usage type, then matching dimension, then cost against usage.</text><text x="50" y="656" font-size="28" fill="#b87333" font-weight="bold" style="font-family:'Segoe UI',Arial,sans-serif" text-anchor="start">4  Standing list</text><text x="380" y="656" font-size="26" fill="#0f2238" font-weight="normal" style="font-family:'Segoe UI',Arial,sans-serif" text-anchor="start">Untagged %, commitments, fired budgets, non-prod share.</text><text x="50" y="748" font-size="28" fill="#b87333" font-weight="bold" style="font-family:'Segoe UI',Arial,sans-serif" text-anchor="start">5  Sweep</text><text x="380" y="748" font-size="26" fill="#0f2238" font-weight="normal" style="font-family:'Segoe UI',Arial,sans-serif" text-anchor="start">Unattached volumes, public IPv4, empty load balancers.</text><text x="50" y="840" font-size="28" fill="#b87333" font-weight="bold" style="font-family:'Segoe UI',Arial,sans-serif" text-anchor="start">6  Write it down</text><text x="380" y="840" font-size="26" fill="#0f2238" font-weight="normal" style="font-family:'Segoe UI',Arial,sans-serif" text-anchor="start">Three lines: what moved, why, what you are doing.</text></svg>