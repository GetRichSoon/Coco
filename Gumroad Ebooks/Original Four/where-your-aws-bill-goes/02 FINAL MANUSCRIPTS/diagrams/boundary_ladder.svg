<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Data transfer boundaries from cheapest to most expensive"><rect width="1200" height="900" fill="#f4efe6"/><text x="600.0" y="58" font-size="40" fill="#0f2238" font-weight="bold" style="font-family:Georgia,serif" text-anchor="middle">Bytes cost by the boundary they cross</text><text x="600.0" y="98" font-size="26" fill="#b87333" font-weight="normal" style="font-family:'Segoe UI',Arial,sans-serif" text-anchor="middle">The ordering is usually stable; check prices for your regions</text><rect x="60" y="590" width="250" height="110" rx="8" fill="#3aa6a0"/><text x="185" y="572" font-size="30" fill="#0f2238" font-weight="bold" style="font-family:Georgia,serif" text-anchor="middle">cheapest</text><text x="185" y="740" font-size="27" fill="#0f2238" font-weight="bold" style="font-family:'Segoe UI',Arial" text-anchor="middle">Within one zone</text><rect x="340" y="500" width="250" height="200" rx="8" fill="#5f9ea0"/><text x="465" y="482" font-size="30" fill="#0f2238" font-weight="bold" style="font-family:Georgia,serif" text-anchor="middle">costs</text><text x="465" y="740" font-size="27" fill="#0f2238" font-weight="bold" style="font-family:'Segoe UI',Arial" text-anchor="middle">Across zones</text><rect x="620" y="410" width="250" height="290" rx="8" fill="#b87333"/><text x="745" y="392" font-size="30" fill="#0f2238" font-weight="bold" style="font-family:Georgia,serif" text-anchor="middle">costs more</text><text x="745" y="740" font-size="27" fill="#0f2238" font-weight="bold" style="font-family:'Segoe UI',Arial" text-anchor="middle">Across regions</text><rect x="900" y="320" width="250" height="380" rx="8" fill="#0f2238"/><text x="1025" y="302" font-size="30" fill="#0f2238" font-weight="bold" style="font-family:Georgia,serif" text-anchor="middle">costs most</text><text x="1025" y="740" font-size="27" fill="#0f2238" font-weight="bold" style="font-family:'Segoe UI',Arial" text-anchor="middle">Out to the internet</text><line x1="40" y1="700" x2="1160" y2="700" stroke="#0f2238" stroke-width="3"/><rect x="60" y="770" width="1080" height="90" rx="12" fill="#fff" stroke="#3aa6a0" stroke-width="3"/><text x="600" y="806" font-size="28" fill="#0f2238" font-weight="bold" style="font-family:'Segoe UI',Arial,sans-serif" text-anchor="middle">Traffic into AWS from the internet is generally not charged.</text><text x="600" y="842" font-size="26" fill="#33475b" font-weight="normal" style="font-family:'Segoe UI',Arial,sans-serif" text-anchor="middle">Traffic out generally is. Bars show order only, not prices.</text></svg>